<header><div><div class="brand">BRIDGE / <b>CRAZY</b> · POCKET ARCHIVE</div><h1 id="title">卡帶之匣</h1></div><div class="top-actions"><span class="badge" id="demo-badge">獨立示範</span><button id="lang" aria-label="Language">EN</button><button id="settings" aria-label="設定">☷</button><button id="eject" hidden>退出卡帶</button></div></header>
<main id="stage" aria-label="可拖動和旋轉的卡帶及遊戲機"><div id="loading"><h2>開啟卡帶之匣</h2><p class="loading-note">正在準備你的口袋遊戲機…</p></div><div id="fallback" hidden><h2>此裝置未能開啟立體畫面</h2><p>仍可用下方卡帶選擇及插入按鈕查看開機流程。</p><canvas id="fallback-lcd" width="512" height="448" style="width:min(320px,90vw);height:auto"></canvas></div><span class="hint-tag" id="slot-hint">卡帶插槽 ↓</span><span class="hint-tag" id="card-hint">拖動卡帶 · 右鍵旋轉</span><div class="pause-banner" id="pause-banner" hidden><button id="resume">繼續試玩</button></div></main>
<footer><div class="status" id="status" role="status" aria-live="polite">挑一盒卡帶，插進遊戲機。</div><nav class="shelf" id="shelf" aria-label="選擇卡帶"></nav><div id="play-controls" hidden><div class="move-pads"><button data-key="left">←</button><button data-key="right">→</button></div><div class="action-pads"><button data-key="up">旋轉</button><button data-key="alt">保留</button><button data-key="down">軟降</button><button data-key="action">落下</button></div></div><div class="bottom-row"><img class="cat" src="./assets/mischief-cat.webp" alt="原貓咪"><p id="description" class="description">先試選關手感；插入後可玩機內 Bridge。<br>← → 換卡 · 空白插入 · Esc 擺正</p><div class="toolbox"><button id="rotate" aria-pressed="false">旋轉卡帶</button><button id="reset">擺正</button><button id="insert">插入卡帶 ↗</button></div></div></footer>
<dialog id="options"><form method="dialog" style="min-width:240px;max-width:340px"><h2 id="settings-title">示範設定</h2><label style="display:block;margin:15px 0"><input type="checkbox" id="reduced"> <span id="reduced-label">減少動態效果</span></label><label style="display:block;margin:15px 0"><input type="checkbox" id="sound" checked> <span id="sound-label">插入／開機音效</span></label><p style="font-size:12px;line-height:1.7" id="settings-note">機內為原 Bridge 的獨立小試玩，不寫正式進度。</p><button id="options-return">返回</button></form></dialog>
