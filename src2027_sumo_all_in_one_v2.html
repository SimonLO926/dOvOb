 0x222831);\n      gridHelper.position.y = -160;\n      scene.add(gridHelper);\n\n      const modelRoot = new THREE.Group();\n      scene.add(modelRoot);\n\n      // Camera Orbit / Pinch / Pan\n      const camState = {\n        theta: 0.78, phi: 1.05, dist: 500,\n        target: new THREE.Vector3(0, 0, 0),\n        goalTarget: new THREE.Vector3(0, 0, 0),\n        goalTheta: 0.78, goalPhi: 1.05, goalDist: 500\n      };\n\n      const activePointers = new Map();\n      let prevPinchDist = 0, prevMid = { x: 0, y: 0 };\n\n      renderer.domElement.addEventListener('pointerdown', (e) => {\n        renderer.domElement.setPointerCapture(e.pointerId);\n        activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY, btn: e.button });\n        if (activePointers.size === 2) {\n          const pts = Array.from(activePointers.values());\n          prevPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);\n          prevMid = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };\n        }\n      });\n      renderer.domElement.addEventListener('pointermove', (e) => {\n        if (!activePointers.has(e.pointerId)) return;\n        const prev = activePointers.get(e.pointerId);\n        const dx = e.clientX - prev.x, dy = e.clientY - prev.y;\n        activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY, btn: prev.btn });\n\n        if (activePointers.size === 1) {\n          if (prev.btn === 2 || e.shiftKey) {\n            const scale = camState.dist * 0.0014;\n            camState.goalTarget.addScaledVector(new THREE.Vector3().setFromMatrixColumn(camera.matrix, 0), -dx * scale);\n            camState.goalTarget.addScaledVector(new THREE.Vector3().setFromMatrixColumn(camera.matrix, 1), dy * scale);\n          } else {\n            camState.goalTheta -= dx * 0.008;\n            camState.goalPhi = Math.max(0.12, Math.min(Math.PI - 0.12, camState.goalPhi - dy * 0.008));\n          }\n        } else if (activePointers.size === 2) {\n          const pts = Array.from(activePointers.values());\n          const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);\n          const mid = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };\n          if (prevPinchDist > 0) camState.goalDist = Math.max(90, Math.min(1300, camState.goalDist * (prevPinchDist / Math.max(1, d))));\n          const scale = camState.dist * 0.0014;\n          camState.goalTarget.addScaledVector(new THREE.Vector3().setFromMatrixColumn(camera.matrix, 0), -(mid.x - prevMid.x) * scale);\n          camState.goalTarget.addScaledVector(new THREE.Vector3().setFromMatrixColumn(camera.matrix, 1), (mid.y - prevMid.y) * scale);\n          prevPinchDist = d; prevMid = mid;\n        }\n      });\n      const endPointer = (e) => { activePointers.delete(e.pointerId); prevPinchDist = 0; };\n      renderer.domElement.addEventListener('pointerup', endPointer);\n      renderer.domElement.addEventListener('pointercancel', endPointer);\n      renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());\n      renderer.domElement.addEventListener('wheel', (e) => {\n        e.preventDefault();\n        camState.goalDist = Math.max(90, Math.min(1300, camState.goalDist + e.deltaY * 0.45));\n      }, { passive: false });\n\n      /* ================================================================\n       * MATERIALS & PART GEOMETRY CACHE\n       * ================================================================ */\n      const partGeoLibrary = new Map();\n      const activeMatCache = new Map();\n      const ghostMatCache = new Map();\n\n      // Adaptive edge lines: light outline on black/dark bricks so black pins pop in Dark Mode!\n      const edgeDarkBrickMat  = new THREE.LineBasicMaterial({ color: 0x94a3b8, transparent: true, opacity: 0.55 });\n      const edgeLightBrickMat = new THREE.LineBasicMaterial({ color: 0x0f172a, transparent: true, opacity: 0.72 });\n      const edgeGhostDarkMat  = new THREE.LineBasicMaterial({ color: 0x64748b, transparent: true, opacity: 0.22 });\n      const edgeGhostLightMat = new THREE.LineBasicMaterial({ color: 0x64748b, transparent: true, opacity: 0.16 });\n\n      let ghostOpacity = 0.26;\n      let ghostMode = 'ghost';\n\n      function getActiveMaterial(colId) {\n        if (activeMatCache.has(colId)) return activeMatCache.get(colId);\n        const info = getColInfo(colId);\n        const isTrans = String(colId) === '12';\n        const mat = new THREE.MeshStandardMaterial({\n          color: info.hex, roughness: 0.34, metalness: 0.08,\n          emissive: info.hex, emissiveIntensity: info.dark ? 0.06 : 0.10,\n          transparent: isTrans, opacity: isTrans ? 0.55 : 1.0,\n          side: THREE.DoubleSide\n        });\n        activeMatCache.set(colId, mat);\n        return mat;\n      }\n\n      function getGhostMaterial(colId) {\n        const key = `${colId}_${ghostMode}_${Math.round(ghostOpacity * 100)}_${isDarkTheme ? 'd' : 'l'}`;\n        if (ghostMatCache.has(key)) return ghostMatCache.get(key);\n        const info = getColInfo(colId);\n        let col = new THREE.Color(info.hex);\n        if (ghostMode === 'ghost') {\n          col.lerp(new THREE.Color(isDarkTheme ? 0x64748b : 0xb8c2cc), 0.52);\n        } else if (ghostMode === 'xray') {\n          col.setHex(isDarkTheme ? 0x475569 : 0x94a3b8);\n        }\n        const isOpaque = (ghostMode === 'solid' && ghostOpacity >= 0.98 && String(colId) !== '12');\n        const mat = new THREE.MeshStandardMaterial({\n          color: col, roughness: 0.55, metalness: 0.02,\n          transparent: !isOpaque, opacity: isOpaque ? 1.0 : ghostOpacity,\n          depthWrite: isOpaque, side: THREE.DoubleSide\n        });\n        ghostMatCache.set(key, mat);\n        return mat;\n      }\n\n      function preparePartLibrary(partsDict) {\n        for (const [pName, trisByCol] of Object.entries(partsDict)) {\n          const entries = [];\n          for (const [subCol, flatArr] of Object.entries(trisByCol)) {\n            if (!flatArr || flatArr.length < 9) continue;\n            const pos = new Float32Array(flatArr.length);\n            for (let i = 0; i < flatArr.length; i += 3) {\n              pos[i] = flatArr[i] * 0.2;\n              pos[i + 1] = flatArr[i + 1] * 0.2;\n              pos[i + 2] = flatArr[i + 2] * 0.2;\n            }\n            const geo = new THREE.BufferGeometry();\n            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));\n            geo.computeVertexNormals();\n            const edgeGeo = new THREE.EdgesGeometry(geo, 30);\n            entries.push({ subCol, geo, edgeGeo });\n          }\n          partGeoLibrary.set(pName, entries);\n        }\n      }\n\n      // Real 3D LEGO Part Thumbnail Renderer (single reusable 96x96 offscreen WebGL context)\n      const thumbCache = new Map();\n      const thumbCanvas = document.createElement('canvas');\n      thumbCanvas.width = 96; thumbCanvas.height = 96;\n      const thumbRenderer = new THREE.WebGLRenderer({ canvas: thumbCanvas, alpha: true, antialias: true, preserveDrawingBuffer: true });\n      thumbRenderer.setSize(96, 96, false);\n      thumbRenderer.outputEncoding = THREE.sRGBEncoding;\n      const thumbScene = new THREE.Scene();\n      thumbScene.add(new THREE.HemisphereLight(0xffffff, 0x64748b, 0.95));\n      const tKey = new THREE.DirectionalLight(0xffffff, 0.85);\n      tKey.position.set(120, 180, 140);\n      thumbScene.add(tKey);\n      const tFill = new THREE.DirectionalLight(0xcbd5e1, 0.4);\n      tFill.position.set(-120, 60, -100);\n      thumbScene.add(tFill);\n      const thumbCam = new THREE.PerspectiveCamera(32, 1, 0.5, 2000);\n      const thumbHolder = new THREE.Group();\n      thumbScene.add(thumbHolder);\n\n      function getPartThumbnail(pName, colId) {\n        const key = `${pName}|${colId}`;\n        if (thumbCache.has(key)) return thumbCache.get(key);\n        const entries = partGeoLibrary.get(pName);\n        if (!entries || !entries.length) return '';\n\n        while (thumbHolder.children.length) thumbHolder.remove(thumbHolder.children[0]);\n        const partGroup = new THREE.Group();\n        partGroup.scale.set(1, -1, 1); // LDraw -> Three.js Y-up\n\n        for (const e of entries) {\n          const finalCol = (e.subCol === '-1') ? colId : e.subCol;\n          const colInfo = getColInfo(finalCol);\n          partGroup.add(new THREE.Mesh(e.geo, getActiveMaterial(finalCol)));\n          partGroup.add(new THREE.LineSegments(e.edgeGeo, colInfo.dark ? edgeDarkBrickMat : edgeLightBrickMat));\n        }\n\n        thumbHolder.add(partGroup);\n        thumbHolder.updateMatrixWorld(true);\n        const box = new THREE.Box3().setFromObject(partGroup);\n        const center = new THREE.Vector3();\n        const sphere = new THREE.Sphere();\n        box.getCenter(center);\n        box.getBoundingSphere(sphere);\n        partGroup.position.sub(center);\n\n        const r = Math.max(sphere.radius, 8);\n        const dist = (r / Math.sin(16 * Math.PI / 180)) * 1.08;\n        // Classic Studio 2.0 isometric 3/4 view angle\n        thumbCam.position.set(dist * 0.62, dist * 0.52, dist * 0.68);\n        thumbCam.lookAt(0, 0, 0);\n        thumbRenderer.render(thumbScene, thumbCam);\n\n        const dataUrl = thumbCanvas.toDataURL('image/png');\n        thumbCache.set(key, dataUrl);\n        return dataUrl;\n      }\n\n      /* ================================================================\n       * INDEPENDENT MODULE LOADER (Main Model + 7 Standalone SubModels)\n       * ================================================================ */\n      let allModules = [];\n      let activeModIdx = 0;\n      let currentStep = 0;\n      let stepGroups = []; // for currently active module\n      let lastMainStep = 0;\n      const subParentStepMap = new Map(); // subModId -> mainStepIdx where it is attached\n      const completedMainSubSteps = new Set(); // tracks main steps whose submodels were already stepped through\n      let subReturnQueue = []; // queue of remaining subModIdx to visit before returning to returnMainStep\n      let returnMainStep = 0;\n\n      function loadModule(modIdx, initialStep = 0) {\n        activeModIdx = modIdx;\n        const mod = allModules[modIdx];\n        if (!mod) return;\n\n        // Clear previous 3D groups from modelRoot\n        while (modelRoot.children.length) modelRoot.remove(modelRoot.children[0]);\n        modelRoot.position.set(0, 0, 0);\n        stepGroups = [];\n\n        const flipY = new THREE.Matrix4().makeScale(1, -1, 1);\n        const modBox = new THREE.Box3();\n\n        mod.steps.forEach((step, sIdx) => {\n          const sGroup = new THREE.Group();\n          const meshes = [];\n          const edges = [];\n          const stepBox = new THREE.Box3();\n\n          step.leaves.forEach(item => {\n            const entries = partGeoLibrary.get(item.p);\n            if (!entries) return;\n            const a = item.m;\n            const m = new THREE.Matrix4().set(\n              a[0], a[1], a[2], a[3],\n              a[4], a[5], a[6], a[7],\n              a[8], a[9], a[10], a[11],\n              0, 0, 0, 1\n            );\n            const worldMat = new THREE.Matrix4().multiplyMatrices(flipY, m);\n            const itemGroup = new THREE.Group();\n            itemGroup.applyMatrix4(worldMat);\n\n            for (const e of entries) {\n              const finalCol = (e.subCol === '-1') ? item.c : e.subCol;\n              const colInfo = getColInfo(finalCol);\n              const mesh = new THREE.Mesh(e.geo, getActiveMaterial(finalCol));\n              mesh.userData.colId = finalCol;\n              itemGroup.add(mesh);\n              meshes.push(mesh);\n\n              const line = new THREE.LineSegments(e.edgeGeo, colInfo.dark ? edgeDarkBrickMat : edgeLightBrickMat);\n              line.userData.isDarkBrick = colInfo.dark;\n              itemGroup.add(line);\n              edges.push(line);\n            }\n            sGroup.add(itemGroup);\n          });\n\n          sGroup.updateMatrixWorld(true);\n          stepBox.setFromObject(sGroup);\n          if (!stepBox.isEmpty()) modBox.union(stepBox);\n          const center = new THREE.Vector3();\n          stepBox.getCenter(center);\n\n          modelRoot.add(sGroup);\n          stepGroups.push({\n            idx: sIdx, rootGroup: sGroup, meshes, edges,\n            bom: step.bom, subs: step.subs, center, animProgress: 1.0\n          });\n        });\n\n        // Center this module neatly at (0,0,0) and auto-fit camera distance!\n        const c = new THREE.Vector3(), size = new THREE.Vector3();\n        modBox.getCenter(c);\n        modBox.getSize(size);\n        modelRoot.position.sub(c);\n        stepGroups.forEach(sg => sg.center.sub(c));\n        gridHelper.position.y = modBox.min.y - c.y - 8;\n\n        const maxDim = Math.max(size.x, size.y, size.z, 120);\n        camState.goalTarget.set(0, 0, 0);\n        camState.goalDist = Math.max(180, Math.min(620, maxDim * 1.48));\n\n        // Update UI tabs, Return-to-Main button & slider\n        document.querySelectorAll('.mod-tab').forEach((btn, i) => btn.classList.toggle('active', i === modIdx));\n        const retBtn = document.getElementById('btn-return-main');\n        if (modIdx > 0) {\n          const targetMain = subParentStepMap.has(mod.id) ? subParentStepMap.get(mod.id) : lastMainStep;\n          returnMainStep = targetMain;\n          retBtn.style.display = 'inline-flex';\n          retBtn.textContent = `\u21a9 \u56de\u4e3b\u8eca\u67b6\uff08\u7b2c ${targetMain + 1} \u6b65\uff09`;\n        } else {\n          retBtn.style.display = 'none';\n          subReturnQueue = [];\n        }\n\n        const sl = document.getElementById('sl-step');\n        sl.max = Math.max(1, stepGroups.length);\n        document.getElementById('hud-mod-name').textContent = mod.title;\n        document.getElementById('meta-mod-desc').textContent = mod.desc;\n\n        goToStep(initialStep, true);\n      }\n\n      function refreshStepVisuals(triggerAnim = false) {\n        const curSG = stepGroups[currentStep];\n        if (!curSG) return;\n\n        stepGroups.forEach((sg, idx) => {\n          const visible = (idx <= currentStep);\n          sg.rootGroup.visible = visible;\n          if (!visible) return;\n\n          const isCurrent = (idx === currentStep);\n          sg.meshes.forEach(m => {\n            m.material = isCurrent ? getActiveMaterial(m.userData.colId) : getGhostMaterial(m.userData.colId);\n          });\n          sg.edges.forEach(e => {\n            if (isCurrent) {\n              e.material = e.userData.isDarkBrick ? edgeDarkBrickMat : edgeLightBrickMat;\n            } else {\n              e.material = isDarkTheme ? edgeGhostDarkMat : edgeGhostLightMat;\n            }\n            e.visible = isCurrent || ghostOpacity > 0.14;\n          });\n\n          if (isCurrent && triggerAnim) {\n            sg.animProgress = 0.0;\n          } else if (!isCurrent) {\n            sg.animProgress = 1.0;\n            sg.rootGroup.position.y = 0;\n          }\n        });\n\n        document.getElementById('hud-step-num').textContent = `STEP ${currentStep + 1} / ${stepGroups.length}`;\n        document.getElementById('meta-progress').textContent = `\u9032\u5ea6\uff1a\u7b2c ${currentStep + 1} / ${stepGroups.length} \u6b65`;\n        document.getElementById('sl-step').value = currentStep + 1;\n\n        // Render BOM Card (Attached SubModels + Direct Parts)\n        const bomList = document.getElementById('bom-list');\n        bomList.innerHTML = '';\n        let totalItems = curSG.subs.length + curSG.bom.length;\n        document.getElementById('bom-count').textContent = `${totalItems} \u9805`;\n\n        // Clickable SubModel Jump Cards when Main Model attaches a completed SubModel!\n        curSG.subs.forEach(sub => {\n          const targetIdx = allModules.findIndex(m => m.id === sub.id);\n          const btn = document.createElement('button');\n          btn.className = 'bom-sub-btn';\n          btn.innerHTML = `\n            <div class=\"bom-sub-title\">\ud83d\udce6 \u639b\u8f09\uff1a${sub.title}</div>\n            <div class=\"bom-sub-hint\">\u9ede\u6b64\u9032\u5165\u7368\u7acb\u5b50\u6a21\u7d44\u6b65\u9a5f \u2192</div>\n          `;\n          if (targetIdx >= 0) {\n            btn.addEventListener('click', () => loadModule(targetIdx, 0));\n          }\n          bomList.appendChild(btn);\n        });\n\n        // Direct leaf parts in this step\n        const counts = new Map();\n        curSG.bom.forEach(it => {\n          const key = `${it.p}|${it.c}`;\n          counts.set(key, (counts.get(key) || 0) + 1);\n        });\n        counts.forEach((qty, key) => {\n          const [p, c] = key.split('|');\n          const colInfo = getColInfo(c);\n          const zhName = PART_NAMES_ZH[p] || p.replace('.dat', '');\n          const row = document.createElement('div');\n          row.className = 'bom-item';\n          const thumbUrl = getPartThumbnail(p, c);\n          row.innerHTML = `\n            <span class=\"bom-qty\">${qty}\u00d7</span>\n            <img class=\"bom-thumb\" src=\"${thumbUrl}\" alt=\"${zhName}\" />\n            <div class=\"bom-info\">\n              <div class=\"bom-name\">${zhName}</div>\n              <div class=\"bom-code\">${colInfo.name} \u00b7 ${p.replace('.dat', '')}</div>\n            </div>\n          `;\n          bomList.appendChild(row);\n        });\n      }\n\n      function updateNavButtonLabels() {\n        const btnPrev = document.getElementById('btn-prev');\n        const btnNext = document.getElementById('btn-next');\n        if (activeModIdx === 0) {\n          btnPrev.textContent = '\u25c0 \u4e0a\u4e00\u6b65';\n          const nextIdx = currentStep + 1;\n          const nextStep = allModules[0] && allModules[0].steps[nextIdx];\n          if (nextStep && nextStep.subs && nextStep.subs.length > 0 && !completedMainSubSteps.has(nextIdx)) {\n            const firstSubTitle = nextStep.subs[0].title.split('\u00b7')[0].trim();\n            btnNext.textContent = `\u4e0b\u4e00\u6b65\uff1a\u9032${firstSubTitle} \u25b6`;\n          } else {\n            btnNext.textContent = (currentStep >= stepGroups.length - 1) ? '\u5df2\u5b8c\u6210 \ud83c\udf89' : '\u4e0b\u4e00\u6b65 \u25b6';\n          }\n        } else {\n          btnPrev.textContent = (currentStep === 0) ? `\u25c0 \u56de\u4e3b\u8eca\u67b6` : '\u25c0 \u4e0a\u4e00\u6b65';\n          if (currentStep >= stepGroups.length - 1) {\n            if (subReturnQueue.length > 0) {\n              const nextSub = allModules[subReturnQueue[0]];\n              btnNext.textContent = `\u4e0b\u4e00\u6b65\uff1a${nextSub.title.split('\u00b7')[0].trim()} \u25b6`;\n            } else {\n              btnNext.textContent = `\u56de\u4e3b\u8eca\u67b6\u7b2c ${returnMainStep + 1} \u6b65 \u25b6`;\n            }\n          } else {\n            btnNext.textContent = '\u4e0b\u4e00\u6b65 \u25b6';\n          }\n        }\n      }\n\n      function goToStep(idx, triggerAnim = true) {\n        currentStep = Math.max(0, Math.min(stepGroups.length - 1, idx));\n        if (activeModIdx === 0) lastMainStep = currentStep;\n        refreshStepVisuals(triggerAnim);\n        updateNavButtonLabels();\n      }\n\n      function stepNextSeamless() {\n        if (activeModIdx === 0) {\n          const nextIdx = currentStep + 1;\n          if (nextIdx >= stepGroups.length) return;\n          const nextStepData = allModules[0].steps[nextIdx];\n          if (nextStepData && nextStepData.subs && nextStepData.subs.length > 0 && !completedMainSubSteps.has(nextIdx)) {\n            // Auto-enter submodel(s) before attaching them on main step nextIdx!\n            const subIndices = nextStepData.subs\n              .map(s => allModules.findIndex(m => m.id === s.id))\n              .filter(i => i > 0);\n            if (subIndices.length > 0) {\n              returnMainStep = nextIdx;\n              lastMainStep = nextIdx;\n              subReturnQueue = subIndices.slice(1);\n              completedMainSubSteps.add(nextIdx);\n              loadModule(subIndices[0], 0);\n              return;\n            }\n          }\n          goToStep(nextIdx, true);\n        } else {\n          if (currentStep < stepGroups.length - 1) {\n            goToStep(currentStep + 1, true);\n          } else if (subReturnQueue.length > 0) {\n            const nextSubIdx = subReturnQueue.shift();\n            loadModule(nextSubIdx, 0);\n          } else {\n            // Finished last step of submodel -> return right to the exact Main Model attachment step!\n            const targetStep = returnMainStep;\n            completedMainSubSteps.add(targetStep);\n            loadModule(0, targetStep);\n          }\n        }\n      }\n\n      function stepPrevSeamless() {\n        if (activeModIdx > 0 && currentStep === 0) {\n          loadModule(0, Math.max(0, returnMainStep - 1));\n        } else {\n          goToStep(currentStep - 1, false);\n        }\n      }\n\n      /* ================================================================\n       * DARK / LIGHT THEME TOGGLE & CONTROLS\n       * ================================================================ */\n      function applyTheme(dark) {\n        isDarkTheme = dark;\n        document.body.classList.toggle('theme-light', !dark);\n        document.getElementById('btn-theme').textContent = dark ? '\u2600\ufe0f \u5207\u660e\u4eae' : '\ud83c\udf19 \u5207\u6697\u9ed1';\n        scene.background = new THREE.Color(dark ? 0x161a20 : 0xe6ebf0);\n        scene.remove(gridHelper);\n        gridHelper = new THREE.GridHelper(600, 30, dark ? 0x334155 : 0xb8c2cc, dark ? 0x222831 : 0xd4dbe3);\n        gridHelper.position.y = -140;\n        scene.add(gridHelper);\n        refreshStepVisuals(false);\n      }\n      document.getElementById('btn-theme').addEventListener('click', () => applyTheme(!isDarkTheme));\n\n      document.getElementById('btn-prev').addEventListener('click', stepPrevSeamless);\n      document.getElementById('btn-next').addEventListener('click', stepNextSeamless);\n      document.getElementById('btn-return-main').addEventListener('click', () => { completedMainSubSteps.add(returnMainStep); loadModule(0, returnMainStep); });\n      document.getElementById('sl-step').addEventListener('input', (e) => goToStep(Number(e.target.value) - 1, false));\n      document.getElementById('btn-replay-anim').addEventListener('click', () => {\n        if (stepGroups[currentStep]) stepGroups[currentStep].animProgress = 0.0;\n      });\n      document.getElementById('btn-focus-step').addEventListener('click', () => {\n        const sg = stepGroups[currentStep];\n        if (sg) { camState.goalTarget.copy(sg.center); camState.goalDist = Math.min(camState.goalDist, 320); }\n      });\n\n      function setGhostMode(mode, opacityVal) {\n        ghostMode = mode; ghostOpacity = opacityVal;\n        document.getElementById('sl-opacity').value = Math.round(opacityVal * 100);\n        document.getElementById('val-opacity').textContent = `${Math.round(opacityVal * 100)}%`;\n        ['mode-ghost', 'mode-xray', 'mode-solid'].forEach(id => {\n          document.getElementById(id).classList.toggle('active-mode', id === `mode-${mode}`);\n        });\n        refreshStepVisuals(false);\n      }\n      document.getElementById('mode-ghost').addEventListener('click', () => setGhostMode('ghost', 0.26));\n      document.getElementById('mode-xray').addEventListener('click', () => setGhostMode('xray', 0.12));\n      document.getElementById('mode-solid').addEventListener('click', () => setGhostMode('solid', 1.0));\n      document.getElementById('sl-opacity').addEventListener('input', (e) => {\n        ghostOpacity = Number(e.target.value) / 100;\n        document.getElementById('val-opacity').textContent = `${e.target.value}%`;\n        if (ghostOpacity >= 0.98) ghostMode = 'solid';\n        else if (ghostMode === 'solid') ghostMode = 'ghost';\n        refreshStepVisuals(false);\n      });\n\n      const setCamPreset = (id, theta, phi) => {\n        ['cam-iso', 'cam-front', 'cam-top', 'cam-bottom'].forEach(k => document.getElementById(k).classList.toggle('active', k === id));\n        camState.goalTheta = theta; camState.goalPhi = phi;\n        camState.goalTarget.set(0, 0, 0);\n      };\n      document.getElementById('cam-iso').addEventListener('click', () => setCamPreset('cam-iso', 0.78, 1.05));\n      document.getElementById('cam-front').addEventListener('click', () => setCamPreset('cam-front', -Math.PI / 2, 1.32));\n      document.getElementById('cam-top').addEventListener('click', () => setCamPreset('cam-top', 0, 0.14));\n      document.getElementById('cam-bottom').addEventListener('click', () => setCamPreset('cam-bottom', 0, Math.PI - 0.16));\n\n      window.addEventListener('keydown', (e) => {\n        if (e.code === 'ArrowRight') stepNextSeamless();\n        if (e.code === 'ArrowLeft')  stepPrevSeamless();\n        if (e.code === 'Space') { e.preventDefault(); if (stepGroups[currentStep]) stepGroups[currentStep].animProgress = 0.0; }\n      });\n\n      window.addEventListener('resize', () => {\n        const w = host.clientWidth, h = Math.max(host.clientHeight, 1);\n        camera.aspect = w / h; camera.updateProjectionMatrix();\n        renderer.setSize(w, h);\n      });\n\n      /* ================================================================\n       * RENDER LOOP & BOOT\n       * ================================================================ */\n      let lastT = performance.now();\n      function animate(now) {\n        requestAnimationFrame(animate);\n        const dt = Math.min(0.05, (now - lastT) / 1000);\n        lastT = now;\n\n        const lerpK = Math.min(1, dt * 10);\n        camState.theta += (camState.goalTheta - camState.theta) * lerpK;\n        camState.phi   += (camState.goalPhi - camState.phi) * lerpK;\n        camState.dist  += (camState.goalDist - camState.dist) * lerpK;\n        camState.target.lerp(camState.goalTarget, lerpK);\n\n        const sinP = Math.sin(camState.phi);\n        camera.position.set(\n          camState.target.x + camState.dist * sinP * Math.sin(camState.theta),\n          camState.target.y + camState.dist * Math.cos(camState.phi),\n          camState.target.z + camState.dist * sinP * Math.cos(camState.theta)\n        );\n        camera.lookAt(camState.target);\n\n        const curSG = stepGroups[currentStep];\n        if (curSG && curSG.animProgress < 1.0) {\n          curSG.animProgress = Math.min(1.0, curSG.animProgress + dt * 2.8);\n          const ease = 1 - Math.pow(1 - curSG.animProgress, 3);\n          curSG.rootGroup.position.y = (1 - ease) * 65;\n        }\n        renderer.render(scene, camera);\n      }\n\n      decodeBuildData(BUILD_DATA_B64).then(data => {\n        preparePartLibrary(data.parts);\n        allModules = data.modules;\n\n        // Build Independent Module Tabs\n        const strip = document.getElementById('module-tabs-strip');\n        strip.innerHTML = '';\n        // Map each submodel to the exact Main Model step that attaches it\n        if (allModules[0]) {\n          allModules[0].steps.forEach((st, sIdx) => {\n            (st.subs || []).forEach(sub => {\n              if (!subParentStepMap.has(sub.id)) subParentStepMap.set(sub.id, sIdx);\n            });\n          });\n        }\n\n        allModules.forEach((m, idx) => {\n          const btn = document.createElement('button');\n          btn.className = 'mod-tab' + (idx === 0 ? ' active' : '');\n          btn.innerHTML = `${m.title} <span class=\"mod-cnt\">(${m.steps.length}\u6b65)</span>`;\n          btn.addEventListener('click', () => {\n            if (idx === 0) {\n              const target = (activeModIdx > 0) ? returnMainStep : lastMainStep;\n              loadModule(0, target);\n            } else {\n              loadModule(idx, 0);\n            }\n          });\n          strip.appendChild(btn);\n        });\n\n        document.getElementById('loading-mask').style.display = 'none';\n        loadModule(0, 0);\n        requestAnimationFrame(animate);\n      }).catch(err => {\n        document.getElementById('loading-mask').textContent = '\u8f09\u5165 3D \u7a4d\u6728\u8cc7\u6599\u5931\u6557\uff1a' + err.message;\n      });\n    })();\n  <\/script>\n</body>\n</html>\n";
      const RULES_HTML = "<!DOCTYPE html>\n<html lang=\"zh-Hant\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>SRC 2027 \u7fbd\u91cf\u7d1a\u9059\u63a7\u76f8\u64b2 \u2014 \u5b8c\u6574\u8cfd\u898f\u8996\u89ba\u5716\u89e3</title>\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\" />\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin />\n  <link href=\"https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Space+Grotesk:wght@600;700&display=swap\" rel=\"stylesheet\" />\n  <style>\n    :root {\n      --bg: #14171c;\n      --card: #1d2229;\n      --card-hi: #252b34;\n      --border: #323946;\n      --ink: #f1f5f9;\n      --muted: #94a3b8;\n      --orange: #ff5500;\n      --green: #22c55e;\n      --red: #ef4444;\n      --blue: #38bdf8;\n      --amber: #f59e0b;\n      --font-ui: 'Space Grotesk', 'Noto Sans TC', sans-serif;\n      --font-mono: 'JetBrains Mono', 'Noto Sans TC', monospace;\n    }\n    * { box-sizing: border-box; margin: 0; padding: 0; }\n    body {\n      background: var(--bg); color: var(--ink);\n      font-family: var(--font-ui); font-size: 12px; line-height: 1.45;\n      padding: 14px 16px 28px; overflow-y: auto;\n    }\n    .wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }\n\n    /* Header Strip */\n    .hero-bar {\n      background: linear-gradient(135deg, #21262e 0%, #171b21 100%);\n      border: 1px solid var(--border); border-left: 4px solid var(--orange);\n      border-radius: 10px; padding: 12px 16px;\n      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;\n    }\n    .hero-title { font-size: 16px; font-weight: 900; letter-spacing: 0.02em; }\n    .hero-sub { font-size: 11px; color: var(--muted); font-family: var(--font-mono); margin-top: 2px; }\n    .hero-badges { display: flex; gap: 6px; flex-wrap: wrap; }\n    .pill {\n      font-family: var(--font-mono); font-size: 10.5px; font-weight: 700;\n      padding: 4px 9px; border-radius: 999px; border: 1px solid var(--border);\n      background: #12151a; color: #e2e8f0;\n    }\n    .pill.orange { border-color: rgba(255,85,0,0.6); color: #ff8547; background: rgba(255,85,0,0.12); }\n    .pill.green  { border-color: rgba(34,197,94,0.5); color: #4ade80; background: rgba(34,197,94,0.10); }\n    .pill.blue   { border-color: rgba(56,189,248,0.5); color: #7dd3fc; background: rgba(56,189,248,0.10); }\n\n    /* Bento Grid */\n    .grid-2 { display: grid; grid-template-columns: 1.15fr 1fr; gap: 12px; }\n    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }\n    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }\n\n    .card {\n      background: var(--card); border: 1px solid var(--border);\n      border-radius: 10px; padding: 12px 13px;\n      display: flex; flex-direction: column; gap: 9px;\n    }\n    .card-hd {\n      display: flex; align-items: center; justify-content: space-between;\n      border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 6px;\n    }\n    .card-title { font-size: 13px; font-weight: 800; display: flex; align-items: center; gap: 6px; }\n    .card-tag {\n      font-family: var(--font-mono); font-size: 9.5px; color: var(--muted);\n      letter-spacing: 0.06em; text-transform: uppercase;\n    }\n\n    /* Spec KPI Tiles */\n    .kpi {\n      background: var(--card-hi); border: 1px solid var(--border);\n      border-radius: 8px; padding: 8px 9px; text-align: center;\n    }\n    .kpi-num { font-family: var(--font-mono); font-size: 16px; font-weight: 700; color: var(--orange); }\n    .kpi-num.blue { color: var(--blue); }\n    .kpi-num.green { color: var(--green); }\n    .kpi-num.red { color: var(--red); }\n    .kpi-lbl { font-size: 10.5px; color: var(--muted); margin-top: 2px; }\n\n    /* Scoring & Progression Boxes */\n    .s       const frames = {
        sim: document.getElementById('frame-sim'),
        ins: document.getElementById('frame-ins'),
        rules: document.getElementById('frame-rules')
      };
      const tabs = {
        sim: document.getElementById('tab-sim'),
        ins: document.getElementById('tab-ins'),
        rules: document.getElementById('tab-rules')
      };
      const loaded = { sim: true, ins: false, rules: false };
      frames.sim.srcdoc = SIM_HTML;

      function switchView(view) {
        if (!loaded[view]) {
          frames[view].srcdoc = (view === 'ins') ? INS_HTML : RULES_HTML;
          loaded[view] = true;
        }
        Object.keys(frames).forEach(k => {
          const active = (k === view);
          tabs[k].classList.toggle('active', active);
          frames[k].classList.toggle('visible', active);
          frames[k].classList.toggle('hidden', !active);
        });
      }

      tabs.sim.addEventListener('click', () => switchView('sim'));
      tabs.ins.addEventListener('click', () => switchView('ins'));
      tabs.rules.addEventListener('click', () => switchView('rules'));
    })();
