    if (isMe) {\n          playTone(523, 0.12, 'triangle', 0.15);\n          setTimeout(() => playTone(659, 0.12, 'triangle', 0.15), 110);\n          setTimeout(() => playTone(784, 0.25, 'triangle', 0.18), 220);\n        } else {\n          playTone(330, 0.15, 'sawtooth', 0.12);\n          setTimeout(() => playTone(247, 0.28, 'sawtooth', 0.14), 140);\n        }\n      }\n\n      /* ================================================================\n       * 3. THREE.JS SCENE & 1:1 CM SRC 2027 ARENA\n       * ================================================================ */\n      const host = document.getElementById('canvas-host');\n      const scene = new THREE.Scene();\n      scene.background = new THREE.Color(0x202220);\n\n      const camera = new THREE.PerspectiveCamera(42, host.clientWidth / Math.max(host.clientHeight, 1), 1, 600);\n      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });\n      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));\n      renderer.setSize(host.clientWidth, host.clientHeight);\n      renderer.shadowMap.enabled = true;\n      renderer.shadowMap.type = THREE.PCFSoftShadowMap;\n      renderer.outputEncoding = THREE.sRGBEncoding;\n      host.appendChild(renderer.domElement);\n\n      const hemi = new THREE.HemisphereLight(0xf8fafc, 0x475569, 0.62);\n      scene.add(hemi);\n      const dirLight = new THREE.DirectionalLight(0xfffaf0, 0.72);\n      dirLight.position.set(45, 95, 55);\n      dirLight.castShadow = true;\n      dirLight.shadow.mapSize.width = 2048;\n      dirLight.shadow.mapSize.height = 2048;\n      dirLight.shadow.camera.near = 20;\n      dirLight.shadow.camera.far = 220;\n      dirLight.shadow.camera.left = -75;\n      dirLight.shadow.camera.right = 75;\n      dirLight.shadow.camera.top = 75;\n      dirLight.shadow.camera.bottom = -75;\n      dirLight.shadow.bias = -0.0005;\n      scene.add(dirLight);\n\n      const rimLight = new THREE.DirectionalLight(0xcbd5e1, 0.25);\n      rimLight.position.set(-60, 45, -50);\n      scene.add(rimLight);\n\n      // Studio Floor\n      const floorCanvas = document.createElement('canvas');\n      floorCanvas.width = 512; floorCanvas.height = 512;\n      const fctx = floorCanvas.getContext('2d');\n      fctx.fillStyle = '#2d302d';\n      fctx.fillRect(0, 0, 512, 512);\n      fctx.strokeStyle = 'rgba(255,255,255,0.045)';\n      fctx.lineWidth = 1;\n      for (let i = 0; i <= 512; i += 32) {\n        fctx.beginPath(); fctx.moveTo(i, 0); fctx.lineTo(i, 512); fctx.stroke();\n        fctx.beginPath(); fctx.moveTo(0, i); fctx.lineTo(512, i); fctx.stroke();\n      }\n      const floorTex = new THREE.CanvasTexture(floorCanvas);\n      floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping;\n      floorTex.repeat.set(10, 10);\n      const floorMesh = new THREE.Mesh(\n        new THREE.PlaneGeometry(360, 360),\n        new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.9, metalness: 0.05 })\n      );\n      floorMesh.rotation.x = -Math.PI / 2;\n      floorMesh.receiveShadow = true;\n      scene.add(floorMesh);\n\n      // High-DPI SRC 2027 Circular Dohyo Texture (2048x2048)\n      function buildDohyoTexture() {\n        const S = 2048;\n        const c = document.createElement('canvas');\n        c.width = S; c.height = S;\n        const ctx = c.getContext('2d');\n        const cx = S / 2, cy = S / 2;\n        const pxPerCm = (S / 2) / ARENA_R;\n\n        const rings = [\n          { r: 50.0, col: '#141517' },\n          { r: 48.5, col: '#6d2c91' },\n          { r: 42.5, col: '#e31e24' },\n          { r: 35.5, col: '#fde100' },\n          { r: 28.5, col: '#7ac143' },\n          { r: 21.5, col: '#0095da' },\n          { r: 14.5, col: '#f4f6f8' }\n        ];\n        for (const ring of rings) {\n          ctx.beginPath();\n          ctx.arc(cx, cy, ring.r * pxPerCm, 0, Math.PI * 2);\n          ctx.fillStyle = ring.col;\n          ctx.fill();\n        }\n\n        // White center dividing line (z = 0)\n        ctx.fillStyle = '#f8fafc';\n        const lineW = 1.1 * pxPerCm;\n        ctx.fillRect(cx - 48.5 * pxPerCm, cy - lineW / 2, 97.0 * pxPerCm, lineW);\n\n        // Two prominent official black start lines at z = \u00b16.0 cm (length 15cm, thickness 1.2cm)\n        // Robots MUST be placed strictly BEHIND these black lines (outer edge at z = \u00b16.6 cm)\n        ctx.fillStyle = '#111113';\n        const barLen = 15.0 * pxPerCm;\n        const barThick = 1.2 * pxPerCm;\n        const barOff = BLACK_LINE_Z * pxPerCm;\n        ctx.fillRect(cx - barLen / 2, cy - barOff - barThick / 2, barLen, barThick);\n        ctx.fillRect(cx - barLen / 2, cy + barOff - barThick / 2, barLen, barThick);\n\n        ctx.fillStyle = 'rgba(30, 41, 59, 0.35)';\n        ctx.font = 'bold 34px \"Space Grotesk\", sans-serif';\n        ctx.textAlign = 'center';\n        ctx.textBaseline = 'middle';\n        ctx.fillText('SRC 2027 \u00b7 SUMO', cx, cy);\n\n        const tex = new THREE.CanvasTexture(c);\n        tex.anisotropy = renderer.capabilities.getMaxAnisotropy();\n        tex.encoding = THREE.sRGBEncoding;\n        return tex;\n      }\n\n      // Solid raised cylinder base (3cm thick)\n      const dohyoBase = new THREE.Mesh(\n        new THREE.CylinderGeometry(ARENA_R, ARENA_R, ARENA_H, 96),\n        new THREE.MeshStandardMaterial({ color: 0x1c1d20, roughness: 0.7 })\n      );\n      dohyoBase.position.y = ARENA_H / 2;\n      dohyoBase.receiveShadow = true;\n      dohyoBase.castShadow = true;\n      scene.add(dohyoBase);\n\n      // Top arena mat using CircleGeometry (avoids CylinderGeometry's 90\u00b0 rotated cap UVs!)\n      // With rotation.x = -PI/2: Canvas X -> World +X (Left-Right), Canvas Y -> World +Z (Top-Bottom)\n      const dohyoTop = new THREE.Mesh(\n        new THREE.CircleGeometry(ARENA_R, 96),\n        new THREE.MeshStandardMaterial({ map: buildDohyoTexture(), roughness: 0.58, metalness: 0.04 })\n      );\n      dohyoTop.rotation.x = -Math.PI / 2;\n      dohyoTop.position.y = ARENA_H + 0.02;\n      dohyoTop.receiveShadow = true;\n      scene.add(dohyoTop);\n\n      // Safe-Zone Dashed Ring (R = 35.5cm)\n      const safeRingGroup = new THREE.Group();\n      safeRingGroup.position.y = ARENA_H + 0.08;\n      const safePts = [];\n      for (let i = 0; i <= 128; i++) {\n        const a = (i / 128) * Math.PI * 2;\n        safePts.push(new THREE.Vector3(Math.cos(a) * SAFE_ZONE_R, 0, Math.sin(a) * SAFE_ZONE_R));\n      }\n      const safeLine = new THREE.Line(\n        new THREE.BufferGeometry().setFromPoints(safePts),\n        new THREE.LineDashedMaterial({ color: 0x22c55e, dashSize: 2.2, gapSize: 1.4, transparent: true, opacity: 0.85 })\n      );\n      safeLine.computeLineDistances();\n      safeRingGroup.add(safeLine);\n      scene.add(safeRingGroup);\n\n      // Tactical 3D Arrows Group\n      const tacticalGroup = new THREE.Group();\n      tacticalGroup.position.y = ARENA_H + 0.16;\n      scene.add(tacticalGroup);\n      let showVectors = true;\n\n      function addCurvedArrow(points, colorHex) {\n        const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(p[0], 0.1, p[1])));\n        const mat = new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.88 });\n        tacticalGroup.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 32, 0.42, 8, false), mat));\n        const end = curve.getPoint(1);\n        const tan = curve.getTangent(1);\n        const cone = new THREE.Mesh(new THREE.ConeGeometry(1.4, 3.2, 12), mat);\n        cone.position.copy(end);\n        cone.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), tan.normalize());\n        tacticalGroup.add(cone);\n      }\n\n      function rebuildTacticalArrows(tacticId) {\n        while (tacticalGroup.children.length) tacticalGroup.remove(tacticalGroup.children[0]);\n        if (!showVectors) return;\n        if (tacticId === 'fast-lr') {\n          addCurvedArrow([[0, -16], [-3, -2], [-6, 15]], 0xef4444);\n          addCurvedArrow([[0, 16], [12, 22], [21, 16]], 0x22c55e);\n          addCurvedArrow([[19, 15], [8, 13], [-4, 13]], 0xff5e14);\n        } else if (tacticId === 'fast-back') {\n          addCurvedArrow([[0, 17], [0, 27]], 0x22c55e);\n          addCurvedArrow([[0, 27], [11, 30], [13, 20]], 0x3b82f6);\n          addCurvedArrow([[11, 19], [4, 11], [-1, 5]], 0xff5e14);\n        } else if (tacticId === 'slow-45') {\n          addCurvedArrow([[0, 16], [-15, 7], [-13, -10], [-4, -15]], 0x22c55e);\n        } else if (tacticId === 'slow-feint') {\n          addCurvedArrow([[0, 15], [10, 20], [16, 12]], 0x22c55e);\n          addCurvedArrow([[14, 10], [6, 3], [-2, 0]], 0xff5e14);\n        } else if (tacticId === 'edge-save') {\n          addCurvedArrow([[16, 0], [34, 0], [52, -2]], 0xef4444);\n          addCurvedArrow([[32, 0], [26, 14], [18, 22]], 0x22c55e);\n        }\n      }\n\n      /* ================================================================\n       * 4. PROCEDURAL 3D ROBOT BUILDERS (+Z = FRONT 11-BLADE ORANGE SCOOP)\n       * ================================================================ */\n      function makeWheelMesh(radius, width, rimColor) {\n        const g = new THREE.Group();\n        const tireMat = new THREE.MeshStandardMaterial({ color: 0x1e2022, roughness: 0.85, metalness: 0.05 });\n        const rimMat = new THREE.MeshStandardMaterial({ color: rimColor, roughness: 0.45, metalness: 0.2 });\n\n        const tire = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, width, 24), tireMat);\n        tire.rotation.z = Math.PI / 2;\n        tire.castShadow = true;\n        g.add(tire);\n\n        const ribGeo = new THREE.BoxGeometry(width + 0.08, 0.35, 0.45);\n        for (let i = 0; i < 12; i++) {\n          const a = (i / 12) * Math.PI * 2;\n          const rib = new THREE.Mesh(ribGeo, tireMat);\n          rib.position.set(0, Math.sin(a) * radius, Math.cos(a) * radius);\n          rib.rotation.x = -a;\n          g.add(rib);\n        }\n\n        const rim = new THREE.Mesh(new THREE.CylinderGeometry(radius * 0.56, radius * 0.56, width + 0.14, 16), rimMat);\n        rim.rotation.z = Math.PI / 2;\n        g.add(rim);\n\n        const axle = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, width + 0.35, 8), new THREE.MeshStandardMaterial({ color: 0xdc2626, roughness: 0.5 }));\n        axle.rotation.z = Math.PI / 2;\n        g.add(axle);\n        return g;\n      }\n\n      function buildMyRobotMesh() {\n        const root = new THREE.Group();\n        const matOrange = new THREE.MeshStandardMaterial({ color: 0xff6d00, roughness: 0.35, metalness: 0.05 });\n        const matLime   = new THREE.MeshStandardMaterial({ color: 0x99d900, roughness: 0.4 });\n        const matRed    = new THREE.MeshStandardMaterial({ color: 0xd62828, roughness: 0.42 });\n        const matLGrey  = new THREE.MeshStandardMaterial({ color: 0xa6adb5, roughness: 0.45 });\n        const matDGrey  = new THREE.MeshStandardMaterial({ color: 0x5c636a, roughness: 0.5 });\n        const matWhite  = new THREE.MeshStandardMaterial({ color: 0xf4f5f6, roughness: 0.32 });\n        const matBlack  = new THREE.MeshStandardMaterial({ color: 0x222426, roughness: 0.6 });\n        const matTan    = new THREE.MeshStandardMaterial({ color: 0xd9bc8c, roughness: 0.5 });\n        const matGreen  = new THREE.MeshStandardMaterial({ color: 0x22c55e, emissive: 0x16a34a, emissiveIntensity: 0.45 });\n\n        // 11-Piece Orange Brick-Separator Front Wedge (+Z = Forward!)\n        const bladeGroup = new THREE.Group();\n        for (let i = 0; i < 11; i++) {\n          const x = (i - 5) * 1.56;\n          const ramp = new THREE.Mesh(new THREE.BoxGeometry(1.48, 0.48, 6.2), matOrange);\n          ramp.position.set(x, 1.85, 6.5);\n          ramp.rotation.x = 0.52;\n          ramp.castShadow = true;\n          ramp.receiveShadow = true;\n          bladeGroup.add(ramp);\n\n          const lip = new THREE.Mesh(new THREE.BoxGeometry(1.48, 0.22, 1.4), matOrange);\n          lip.position.set(x, 0.22, 9.2);\n          lip.rotation.x = 0.2;\n          bladeGroup.add(lip);\n\n          const ridge = new THREE.Mesh(new THREE.BoxGeometry(0.88, 0.25, 4.4), matOrange);\n          ridge.position.set(x, 2.35, 6.0);\n          ridge.rotation.x = 0.52;\n          bladeGroup.add(ridge);\n        }\n        root.add(bladeGroup);\n\n        const limeBar = new THREE.Mesh(new THREE.BoxGeometry(16.8, 1.0, 1.2), matLime);\n        limeBar.position.set(0, 4.1, 3.6); limeBar.castShadow = true; root.add(limeBar);\n\n        const greyWall = new THREE.Mesh(new THREE.BoxGeometry(17.2, 4.8, 1.1), matLGrey);\n        greyWall.position.set(0, 3.2, 2.6); greyWall.castShadow = true; root.add(greyWall);\n\n        const redWall = new THREE.Mesh(new THREE.BoxGeometry(16.4, 5.2, 1.0), matRed);\n        redWall.position.set(0, 3.5, 1.6); redWall.castShadow = true; root.add(redWall);\n\n        const sideL = new THREE.Mesh(new THREE.BoxGeometry(1.1, 3.6, 11.5), matRed);\n        sideL.position.set(-7.6, 2.5, -3.2); sideL.castShadow = true; root.add(sideL);\n        const sideR = new THREE.Mesh(new THREE.BoxGeometry(1.1, 3.6, 11.5), matRed);\n        sideR.position.set(7.6, 2.5, -3.2); sideR.castShadow = true; root.add(sideR);\n\n        const rearBeam = new THREE.Mesh(new THREE.BoxGeometry(16.4, 1.6, 1.2), matRed);\n        rearBeam.position.set(0, 2.2, -9.0); rearBeam.castShadow = true; root.add(rearBeam);\n\n        const motorL = new THREE.Mesh(new THREE.BoxGeometry(3.2, 3.0, 5.6), matDGrey);\n        motorL.position.set(-3.2, 2.6, -1.6); motorL.castShadow = true; root.add(motorL);\n        const motorR = new THREE.Mesh(new THREE.BoxGeometry(3.2, 3.0, 5.6), matDGrey);\n        motorR.position.set(3.2, 2.6, -1.6); motorR.castShadow = true; root.add(motorR);\n\n        const midBrace = new THREE.Mesh(new THREE.BoxGeometry(14.5, 1.2, 2.2), matLGrey);\n        midBrace.position.set(0, 4.3, -1.5); root.add(midBrace);\n\n        const gearL = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.1, 0.7, 14), matTan);\n        gearL.rotation.z = Math.PI / 2; gearL.position.set(-4.3, 2.8, -5.4); root.add(gearL);\n        const gearR = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.1, 0.7, 14), matTan);\n        gearR.rotation.z = Math.PI / 2; gearR.position.set(4.3, 2.8, -5.4); root.add(gearR);\n\n        const hub = new THREE.Mesh(new THREE.BoxGeometry(6.6, 3.6, 5.2), matWhite);\n        hub.position.set(0, 5.4, -6.2); hub.castShadow = true; root.add(hub);\n        const hubBtn = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.25, 1.1), matGreen);\n        hubBtn.position.set(0, 7.25, -6.2); root.add(hubBtn);\n\n        const handleBar = new THREE.Mesh(new THREE.BoxGeometry(13.6, 0.8, 1.5), matBlack);\n        handleBar.position.set(0, 8.6, -3.5); handleBar.castShadow = true; root.add(handleBar);\n        const handlePadL = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.9, 2.8), matWhite);\n        handlePadL.position.set(-5.2, 8.5, -3.5); root.add(handlePadL);\n        const handlePadR = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.9, 2.8), matWhite);\n        handlePadR.position.set(5.2, 8.5, -3.5); root.add(handlePadR);\n        const handlePostL = new THREE.Mesh(new THREE.BoxGeometry(0.9, 5.0, 1.2), matRed);\n        handlePostL.position.set(-6.5, 6.0, -3.5); root.add(handlePostL);\n        const handlePostR = new THREE.Mesh(new THREE.BoxGeometry(0.9, 5.0, 1.2), matRed);\n        handlePostR.position.set(6.5, 6.0, -3.5); root.add(handlePostR);\n\n        const wheelL = makeWheelMesh(2.8, 2.6, 0xb8bec6);\n        wheelL.position.set(-6.1, 2.8, -5.4); root.add(wheelL);\n        const wheelR = makeWheelMesh(2.8, 2.6, 0xb8bec6);\n        wheelR.position.set(6.1, 2.8, -5.4); root.add(wheelR);\n\n        const skid = new THREE.Mesh(new THREE.BoxGeometry(8.0, 0.5, 2.4), matWhite);\n        skid.position.set(0, 0.3, 2.4); root.add(skid);\n\n        return { root, wheelL, wheelR, gearL, gearR };\n      }\n\n      function buildOpponentMesh(arch) {\n        const root = new THREE.Group();\n        const matMain   = new THREE.MeshStandardMaterial({ color: arch.colorMain, roughness: 0.38, metalness: 0.1 });\n        const matBlade  = new THREE.MeshStandardMaterial({ color: arch.colorBlade, roughness: 0.35, metalness: 0.15 });\n        const matAccent = new THREE.MeshStandardMaterial({ color: arch.colorAccent, roughness: 0.55 });\n        const matWhite  = new THREE.MeshStandardMaterial({ color: 0xf1f5f9, roughness: 0.35 });\n\n        const w = arch.width, l = arch.length;\n        const body = new THREE.Mesh(new THREE.BoxGeometry(w - 3.0, 4.4, l - 5.0), matMain);\n        body.position.set(0, 3.0, -1.6); body.castShadow = true; body.receiveShadow = true; root.add(body);\n\n        const hub = new THREE.Mesh(new THREE.BoxGeometry(6.2, 2.2, 5.4), matWhite);\n        hub.position.set(0, 6.0, -2.0); hub.castShadow = true; root.add(hub);\n\n        const chevron = new THREE.Mesh(new THREE.ConeGeometry(1.4, 2.6, 3), matBlade);\n        chevron.rotation.x = Math.PI / 2; chevron.position.set(0, 7.25, -1.5); root.add(chevron);\n\n        const bladeW = arch.id === 'fast' ? w * 0.78 : w * 0.96;\n        const blade = new THREE.Mesh(new THREE.BoxGeometry(bladeW, 0.65, 5.4), matBlade);\n        blade.position.set(0, 1.75, l / 2 - 2.6); blade.rotation.x = 0.52; blade.castShadow = true; root.add(blade);\n        const bladeLip = new THREE.Mesh(new THREE.BoxGeometry(bladeW, 0.25, 1.2), matBlade);\n        bladeLip.position.set(0, 0.25, l / 2 - 0.3); root.add(bladeLip);\n\n        if (arch.id === 'fast') {\n          const finGeo = new THREE.BoxGeometry(0.6, 2.2, 6.0);\n          const finL = new THREE.Mesh(finGeo, matAccent); finL.position.set(-w/2 + 2.0, 5.4, -4.5); root.add(finL);\n          const finR = new THREE.Mesh(finGeo, matAccent); finR.position.set( w/2 - 2.0, 5.4, -4.5); root.add(finR);\n        } else if (arch.id === 'slow') {\n          const armGeo = new THREE.BoxGeometry(1.4, 3.4, l - 6.0);\n          const armL = new THREE.Mesh(armGeo, matAccent); armL.position.set(-w/2 + 1.0, 2.8, -1.5); root.add(armL);\n          const armR = new THREE.Mesh(armGeo, matAccent); armR.position.set( w/2 - 1.0, 2.8, -1.5); root.add(armR);\n        }\n\n        const wheelR = arch.id === 'fast' ? 2.6 : 2.85;\n        const wheelW = arch.id === 'fast' ? 2.0 : 2.6;\n        const wL = makeWheelMesh(wheelR, wheelW, 0xe2e8f0); wL.position.set(-w/2 + 1.1, wheelR, -2.5); root.add(wL);\n        const wR = makeWheelMesh(wheelR, wheelW, 0xe2e8f0); wR.position.set( w/2 - 1.1, wheelR, -2.5); root.add(wR);\n\n        return { root, wheelL: wL, wheelR: wR };\n      }\n\n      // Paper Cups (Drill Level 1)\n      const cupGroup = new THREE.Group();\n      scene.add(cupGroup);\n      let cups = [];\n      function clearCups() {\n        while (cupGroup.children.length) cupGroup.remove(cupGroup.children[0]);\n        cups = [];\n      }\n      function spawnCupTower() {\n        clearCups();\n        const cupMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.4 });\n        const rimMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.3 });\n        [{ x: -3.8, z: 0 }, { x: 3.8, z: 0 }, { x: 0.0, z: -4.2 }].forEach((p, idx) => {\n          const g = new THREE.Group();\n          const body = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 2.6, 8.5, 20), cupMat);\n          body.position.y = 4.25; body.castShadow = true; g.add(body);\n          const rim = new THREE.Mesh(new THREE.TorusGeometry(3.2, 0.22, 8, 20), rimMat);\n          rim.rotation.x = Math.PI / 2; rim.position.y = 8.5; g.add(rim);\n          g.position.set(p.x, ARENA_H, p.z);\n          cupGroup.add(g);\n          cups.push({ id: idx, mesh: g, x: p.x, z: p.z, vx: 0, vz: 0, r: 3.3, out: false, fallY: 0, vy: 0 });\n        });\n      }\n\n      /* ================================================================\n       * 5. SIMULATION STATE & EXACT BEHIND-BLACK-LINE START POSES\n       * ================================================================ */\n      const myVisual = buildMyRobotMesh();\n      scene.add(myVisual.root);\n\n      let currentArch = ARCHETYPES.fast;\n      let oppVisual = buildOpponentMesh(currentArch);\n      scene.add(oppVisual.root);\n\n      const state = {\n        phase: 'idle',\n        mode: 'duel',\n        activeTactic: 'fast-lr',\n        pose: 'left',\n        ctrlMode: 'tank', // 'tank' (left+right edge sticks) | 'arcade' (left 360\u00b0 stick ONLY, right side empty)\n        simSpeed: 1.0,\n        round: 1,\n        scoreMe: 0,\n        scoreOpp: 0,\n        timer: 60.0,\n        countdownVal: 3,\n        countdownAcc: 0,\n        matchElapsed: 0,\n        oppSpeedMult: 1.0,\n        oppTorqueMult: 1.0,\n        deadlockTime: 0,\n        feintTimer: 0,\n        contactText: '\u672a\u63a5\u89f8',\n        advText: '\u2014',\n        bumpCooldown: 0\n      };\n\n      function createBody(spec) {\n        return {\n          x: 0, z: 0, y: ARENA_H,\n          vx: 0, vz: 0, vy: 0,\n          heading: 0, omega: 0,\n          leftCmd: 0, rightCmd: 0,\n          pitch: 0, roll: 0, targetPitch: 0, targetRoll: 0,\n          lifted: 0, out: false, spec\n        };\n      }\n\n      let me = createBody(MY_SPEC);\n      let opp = createBody(currentArch);\n\n      // EXACT SRC 2027 Rule H.4 & Slide 3/4:\n      // Outer edge of black start lines is at z = \u00b1(BLACK_LINE_Z + 0.6) = \u00b16.6 cm.\n      // Every single part of each robot MUST sit strictly BEHIND its black line!\n      function applyStartPose(pose) {\n        state.pose = pose;\n        clearCups();\n        oppVisual.root.visible = (pose !== 'drill1');\n\n        const resetBody = (b, x, z, heading) => {\n          b.x = x; b.z = z; b.y = ARENA_H;\n          b.vx = 0; b.vz = 0; b.vy = 0;\n          b.heading = heading; b.omega = 0;\n          b.leftCmd = 0; b.rightCmd = 0;\n          b.pitch = 0; b.roll = 0; b.targetPitch = 0; b.targetRoll = 0;\n          b.lifted = 0; b.out = false;\n        };\n\n        const lineEdge = BLACK_LINE_Z + 0.7; // 6.7 cm (flush behind the black line!)\n        const myHalfW  = MY_SPEC.width * 0.5;        // 8.8 cm\n        const myHalfL  = MY_SPEC.length * 0.5 + 0.4; // 10.0 cm (clears 11-blade tip & rear beam)\n        const oppHalfW = currentArch.width * 0.5;\n        const oppHalfL = currentArch.length * 0.5 + 0.3;\n\n        if (pose === 'left') {\n          // Centered left-right, inner side flush behind black line, facing own Left\n          resetBody(me,  0,  lineEdge + myHalfW,  -Math.PI / 2);\n          resetBody(opp, 0, -(lineEdge + oppHalfW), Math.PI / 2);\n        } else if (pose === 'right') {\n          resetBody(me,  0,  lineEdge + myHalfW,   Math.PI / 2);\n          resetBody(opp, 0, -(lineEdge + oppHalfW), -Math.PI / 2);\n        } else if (pose === 'back') {\n          // Rear beam flush behind black line, facing outward\n          resetBody(me,  0,  lineEdge + myHalfL,   0);\n          resetBody(opp, 0, -(lineEdge + oppHalfL), Math.PI);\n        } else if (pose === 'front') {\n          // Front blade tip flush behind black line, facing center\n          resetBody(me,  0,  lineEdge + myHalfL,   Math.PI);\n          resetBody(opp, 0, -(lineEdge + oppHalfL), 0);\n        } else if (pose === 'edge') {\n          resetBody(me,  32.0, 0, -Math.PI / 2);\n          resetBody(opp, 12.0, 0,  Math.PI / 2);\n        } else if (pose === 'drill1') {\n          resetBody(me, 0, 35.0, Math.PI);\n          resetBody(opp, 0, -90, 0);\n          spawnCupTower();\n        }\n\n        state.timer = 60.0;\n        state.matchElapsed = 0;\n        state.deadlockTime = 0;\n        state.feintTimer = 0;\n        state.contactText = '\u672a\u63a5\u89f8';\n        state.advText = '\u2014';\n        syncMeshes();\n        updateScoreboardUI();\n      }\n\n      /* ================================================================\n       * 6. INPUT SYSTEM (iPad Multi-Touch Edge Sticks + Arcade 360\u00b0 + Keys + Gamepad)\n       * ================================================================ */\n      const keys = {};\n      let touchLeft = 0, touchRight = 0;\n      let arcadeFwd = 0, arcadeTrn = 0;\n      let holdBtnLeftBack = false, holdBtnRightBack = false;\n\n      window.addEventListener('keydown', (e) => {\n        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();\n        keys[e.code] = true;\n        if (e.code === 'Space' && state.phase === 'running') triggerFeintMove();\n      });\n      window.addEventListener('keyup', (e) => { keys[e.code] = false; });\n\n      function triggerFeintMove() {\n        if (state.feintTimer <= 0) {\n          state.feintTimer = 0.85;\n          showToast('\u26a1 \u89f8\u767c\u300c\u6ed1\u6b65\u7834\u50f5\u5c40\u300d\uff1a\u7e5e\u904e\u5c0d\u624b\u8eca\u982d\u5207\u5165\u5074\u9762\uff01');\n          playClick();\n        }\n      }\n\n      // Multi-touch independent vertical tank sticks (Left Edge 1 & Right Edge 2)\n      function bindTankStick(trackId, setter) {\n        const track = document.getElementById(trackId);\n        let activePointerId = null;\n        const update = (clientY) => {\n          const rect = track.getBoundingClientRect();\n          const norm = ((rect.top + rect.height / 2) - clientY) / (rect.height / 2 - 22);\n          setter(Math.max(-1, Math.min(1, norm)));\n        };\n        track.addEventListener('pointerdown', (e) => {\n          e.stopPropagation();\n          activePointerId = e.pointerId;\n          track.setPointerCapture(e.pointerId);\n          update(e.clientY);\n        });\n        track.addEventListener('pointermove', (e) => {\n          if (activePointerId === e.pointerId) update(e.clientY);\n        });\n        const release = (e) => {\n          if (activePointerId === e.pointerId) {\n            activePointerId = null;\n            setter(0);\n          }\n        };\n        track.addEventListener('pointerup', release);\n        track.addEventListener('pointercancel', release);\n      }\n      bindTankStick('stick-left-track', v => { touchLeft = v; });\n      bindTankStick('stick-right-track', v => { touchRight = v; });\n\n      // 360\u00b0 Single Analog Joystick (Left Edge ONLY in Arcade Mode)\n      (function bindArcadeStick() {\n        const pad = document.getElementById('arcade-pad');\n        const well = document.getElementById('arcade-well');\n        const knob = document.getElementById('arcade-knob');\n        let pid = null;\n        const maxR = 38;\n        const update = (cx, cy) => {\n          const rect = well.getBoundingClientRect();\n          const ox = rect.left + rect.width / 2;\n          const oy = rect.top + rect.height / 2;\n          let dx = cx - ox, dy = cy - oy;\n          const dist = Math.hypot(dx, dy);\n          if (dist > maxR) { dx = (dx / dist) * maxR; dy = (dy / dist) * maxR; }\n          knob.style.left = `${36 + dx}px`;\n          knob.style.top  = `${36 + dy}px`;\n          arcadeTrn = dx / maxR;\n          arcadeFwd = -dy / maxR;\n        };\n        const reset = () => {\n          pid = null;\n          arcadeFwd = 0; arcadeTrn = 0;\n          knob.style.left = '36px'; knob.style.top = '36px';\n        };\n        pad.addEventListener('pointerdown', (e) => {\n          e.stopPropagation();\n          pid = e.pointerId;\n          pad.setPointerCapture(e.pointerId);\n          update(e.clientX, e.clientY);\n        });\n        pad.addEventListener('pointermove', (e) => {\n          if (pid === e.pointerId) update(e.clientX, e.clientY);\n        });\n        pad.addEventListener('pointerup', (e) => { if (pid === e.pointerId) reset(); });\n        pad.addEventListener('pointercancel', (e) => { if (pid === e.pointerId) reset(); });\n      })();\n\n      function getManualCommands() {\n        if (state.feintTimer > 0) {\n          if (state.feintTimer > 0.40) return { l: 1.0, r: -0.25 };\n          return { l: 1.0, r: 0.75 };\n        }\n        if (keys['KeyQ'] || holdBtnLeftBack)  return { l: -1.0, r:  0.0 };\n        if (keys['KeyE'] || holdBtnRightBack) return { l:  0.0, r: -1.0 };\n\n        // Gamepad\n        try {\n          const pads = navigator.getGamepads ? navigator.getGamepads() : [];\n          const gp = pads && Array.from(pads).find(p => p && p.connected);\n          if (gp) {\n            document.getElementById('gamepad-status').textContent = '\u624b\u63a3\uff1a\u5df2\u9023\u7dda';\n            document.getElementById('gamepad-status').style.color = '#15803d';\n            const dz = v => Math.abs(v) < 0.15 ? 0 : v;\n            let l, r;\n            if (state.ctrlMode === 'tank') {\n              l = dz(-gp.axes[1]);\n              r = dz(-(gp.axes[3] !== undefined ? gp.axes[3] : gp.axes[1]));\n            } else {\n              const f = dz(-gp.axes[1]), t = dz(gp.axes[0]);\n              l = Math.max(-1, Math.min(1, f + t));\n              r = Math.max(-1, Math.min(1, f - t));\n            }\n            if (Math.abs(l) > 0.05 || Math.abs(r) > 0.05) return { l, r };\n          }\n        } catch (e) {}\n\n        // On-screen iPad edge sticks\n        if (state.ctrlMode === 'tank') {\n          if (Math.abs(touchLeft) > 0.04 || Math.abs(touchRight) > 0.04) {\n            return { l: touchLeft, r: touchRight };\n          }\n          let l = 0, r = 0;\n          if (keys['KeyW']) l += 1;\n          if (keys['KeyS']) l -= 1;\n          if (keys['ArrowUp'] || keys['KeyI']) r += 1;\n          if (keys['ArrowDown'] || keys['KeyK']) r -= 1;\n          if (keys['KeyA'] || keys['ArrowLeft'])  { l = -0.85; r =  0.85; }\n          if (keys['KeyD'] || keys['ArrowRight']) { l =  0.85; r = -0.85; }\n          return { l, r };\n        } else {\n          if (Math.abs(arcadeFwd) > 0.04 || Math.abs(arcadeTrn) > 0.04) {\n            return {\n              l: Math.max(-1, Math.min(1, arcadeFwd + arcadeTrn * 0.9)),\n              r: Math.max(-1, Math.min(1, arcadeFwd - arcadeTrn * 0.9))\n            };\n          }\n          let fwd = 0, trn = 0;\n          if (keys['KeyW'] || keys['ArrowUp'])    fwd += 1;\n          if (keys['KeyS'] || keys['ArrowDown'])  fwd -= 1;\n          if (keys['KeyA'] || keys['ArrowLeft'])  trn -= 0.85;\n          if (keys['KeyD'] || keys['ArrowRight']) trn += 0.85;\n          return {\n            l: Math.max(-1, Math.min(1, fwd + trn)),\n            r: Math.max(-1, Math.min(1, fwd - trn))\n          };\n        }\n      }\n\n      /* ================================================================\n       * 7. AUTOPILOT TACTICAL DEMO & OPPONENT AI\n       * ================================================================ */\n      function normalizeAngle(a) {\n        while (a > Math.PI) a -= Math.PI * 2;\n        while (a < -Math.PI) a += Math.PI * 2;\n        return a;\n      }\n\n      function steerToward(body, tx, tz, speedScale = 1.0) {\n        const desired = Math.atan2(tx - body.x, tz - body.z);\n        const err = normalizeAngle(desired - body.heading);\n        if (Math.abs(err) > 0.55) {\n          return err > 0 ? { l: -0.95, r: 0.95 } : { l: 0.95, r: -0.95 };\n        }\n        const turn = Math.max(-1, Math.min(1, -err * 2.2));\n        return {\n          l: Math.max(-1, Math.min(1, (1.0 + turn) * speedScale)),\n          r: Math.max(-1, Math.min(1, (1.0 - turn) * speedScale))\n        };\n      }\n\n      function getDemoPlayerCommands() {\n        const t = state.matchElapsed;\n        const tac = state.activeTactic;\n        const rMe = Math.hypot(me.x, me.z);\n        const setStep = (idx) => {\n          document.querySelectorAll('#strat-steps li').forEach((li, i) => li.classList.toggle('active-step', i === idx));\n        };\n\n        if (tac === 'fast-lr') {\n          if (t < 0.78) {\n            setStep(1);\n            return state.pose === 'right' ? { l: -1.0, r: 0.0 } : { l: 0.0, r: -1.0 };\n          }\n          setStep(2);\n          return steerToward(me, opp.x, opp.z, 1.0);\n        }\n        if (tac === 'fast-back') {\n          if (t < 0.34 && rMe < 25.0) {\n            setStep(0);\n            return { l: 1.0, r: 1.0 };\n          } else if (t < 1.18 && Math.abs(normalizeAngle(Math.PI - me.heading)) > 0.25) {\n            setStep(1);\n            return { l: -1.0, r: 1.0 };\n          }\n          setStep(2);\n          return steerToward(me, opp.x, opp.z, 1.0);\n        }\n        if (tac === 'slow-45') {\n          if (t < 0.95) {\n            setStep(1);\n            return state.pose === 'right' ? { l: 0.28, r: 1.0 } : { l: 1.0, r: 0.28 };\n          }\n          setStep(2);\n          return steerToward(me, opp.x, opp.z, 1.0);\n        }\n        if (tac === 'slow-feint') {\n          if (t < 0.85) { setStep(0); return { l: 1.0, r: 1.0 }; }\n          if (t < 1.30) { setStep(1); return { l: 1.0, r: -0.25 }; }\n          if (t < 1.85) { setStep(2); return { l: 1.0, r: 0.75 }; }\n          setStep(2);\n          return steerToward(me, opp.x, opp.z, 1.0);\n        }\n        if (tac === 'edge-save') {\n          if (t < 0.72) { setStep(1); return { l: 0.35, r: 1.0 }; }\n          setStep(2);\n          return steerToward(me, opp.x, opp.z, 1.0);\n        }\n        const aliveCup = cups.find(c => !c.out);\n        if (aliveCup) {\n          if (rMe > 38) return steerToward(me, 0, 0, 0.85);\n          return steerToward(me, aliveCup.x, aliveCup.z, 0.85);\n        }\n        return { l: 0, r: 0 };\n      }\n\n      function getOpponentCommands() {\n        if (state.pose === 'drill1') return { l: 0, r: 0 };\n        const arch = currentArch.id;\n        const rOpp = Math.hypot(opp.x, opp.z);\n\n        if (state.pose === 'edge' && state.matchElapsed < 1.45) return { l: 1.0, r: 1.0 };\n        if (state.mode === 'demo' && state.activeTactic === 'slow-feint' && state.matchElapsed >= 0.85 && state.matchElapsed < 1.60) {\n          return { l: 1.0, r: 1.0 };\n        }\n        if (rOpp > 42.5 && !(arch === 'fast' && Math.hypot(opp.vx, opp.vz) > 26)) {\n          return steerToward(opp, 0, 0, 0.9);\n        }\n\n        const desired = Math.atan2(me.x - opp.x, me.z - opp.z);\n        const err = normalizeAngle(desired - opp.heading);\n\n        if (arch === 'fast') {\n          if (Math.abs(err) > 0.28) return err > 0 ? { l: -1.0, r: 1.0 } : { l: 1.0, r: -1.0 };\n          return { l: 1.0, r: 1.0 };\n        }\n        if (arch === 'slow') {\n          if (Math.abs(err) > 0.25) return err > 0 ? { l: -0.9, r: 0.9 } : { l: 0.9, r: -0.9 };\n          return { l: 1.0, r: 1.0 };\n        }\n        const offsetAngle = desired + Math.sin(state.matchElapsed * 1.4) * 0.22;\n        const bErr = normalizeAngle(offsetAngle - opp.heading);\n        const trn = Math.max(-1, Math.min(1, -bErr * 2.0));\n        return { l: Math.max(-1, Math.min(1, 0.92 + trn)), r: Math.max(-1, Math.min(1, 0.92 - trn)) };\n      }\n\n      /* ================================================================\n       * 8. PHYSICS ENGINE (120 Hz)\n       * ================================================================ */\n      function stepBodyDrive(b, dt, speedMult = 1.0) {\n        if (b.out) {\n          b.vy -= 980 * dt;\n          b.y = Math.max(0, b.y + b.vy * dt);\n          b.x += b.vx * dt; b.z += b.vz * dt;\n          b.vx *= Math.max(0, 1 - 4.0 * dt);\n          b.vz *= Math.max(0, 1 - 4.0 * dt);\n          b.pitch += (b.targetPitch - b.pitch) * Math.min(1, dt * 8);\n          b.roll  += (b.targetRoll - b.roll) * Math.min(1, dt * 8);\n          return;\n        }\n        const spec = b.spec;\n        const grip = Math.max(0.22, 1.0 - (b.lifted || 0) * 0.78);\n        b.lifted = Math.max(0, (b.lifted || 0) - dt * 4.0);\n\n        const maxSpd = spec.maxSpeed * speedMult;\n        const maxTrn = spec.maxTurn * Math.sqrt(speedMult);\n        const fwdCmd = (b.leftCmd + b.rightCmd) * 0.5;\n        const trnCmd = (b.leftCmd - b.rightCmd) * 0.5;\n\n        const targetOmega = -trnCmd * maxTrn * grip;\n        b.omega += (targetOmega - b.omega) * Math.min(1, dt * 11.0);\n        b.heading = normalizeAngle(b.heading + b.omega * dt);\n\n        const fx = Math.sin(b.heading), fz = Math.cos(b.heading);\n        const rx = fz, rz = -fx;\n        let vFwd = b.vx * fx + b.vz * fz;\n        let vLat = b.vx * rx + b.vz * rz;\n\n        const targetVFwd = fwdCmd * maxSpd;\n        const accelRate = (Math.abs(targetVFwd) > Math.abs(vFwd) ? spec.accel * speedMult : spec.brakeDrag * 22.0) * grip;\n        const dv = targetVFwd - vFwd;\n        vFwd += Math.max(-accelRate * dt, Math.min(accelRate * dt, dv));\n\n        const latGrip = ((spec.id === 'fast') ? 4.8 : 9.0) * grip;\n        vLat *= Math.max(0, 1 - latGrip * dt);\n\n        b.vx = fx * vFwd + rx * vLat;\n        b.vz = fz * vFwd + rz * vLat;\n        b.x += b.vx * dt; b.z += b.vz * dt;\n\n        b.pitch += (b.targetPitch - b.pitch) * Math.min(1, dt * 10);\n        b.roll  += (b.targetRoll - b.roll) * Math.min(1, dt * 10);\n        b.targetPitch *= Math.max(0, 1 - 6 * dt);\n        b.targetRoll  *= Math.max(0, 1 - 6 * dt);\n      }\n\n      function resolveRobotCollision(dt) {\n        if (state.pose === 'drill1' || me.out || opp.out) return;\n        const dx = opp.x - me.x, dz = opp.z - me.z;\n        const dist = Math.hypot(dx, dz);\n        const minDist = (me.spec.length * 0.45) + (opp.spec.length * 0.45);\n\n        if (dist >= minDist || dist < 0.001) {\n          state.deadlockTime = Math.max(0, state.deadlockTime - dt * 2);\n          state.contactText = '\u672a\u63a5\u89f8'; state.advText = '\u2014';\n          return;\n        }\n\n        const nx = dx / dist, nz = dz / dist, overlap = minDist - dist;\n        const tx = -nz, tz = nx;\n        const mFx = Math.sin(me.heading), mFz = Math.cos(me.heading);\n        const oFx = Math.sin(opp.heading), oFz = Math.cos(opp.heading);\n\n        const meAlign  = mFx * nx + mFz * nz;\n        const oppAlign = oFx * (-nx) + oFz * (-nz);\n        const meWedgeActive  = meAlign > 0.58;\n        const oppWedgeActive = oppAlign > 0.58;\n        const oppFlankExposed = oppAlign < 0.48;\n        const meFlankExposed  = meAlign < 0.48;\n\n        const meDrive  = Math.max(0.15, (me.leftCmd + me.rightCmd) * 0.5 + 0.35);\n        const oppDrive = Math.max(0.15, (opp.leftCmd + opp.rightCmd) * 0.5 + 0.35);\n\n        let mePower  = me.spec.pushForce * meDrive * (meWedgeActive ? 1.25 : 0.45);\n        let oppPower = opp.spec.pushForce * state.oppTorqueMult * oppDrive * (oppWedgeActive ? 1.25 : 0.45);\n\n        if (meWedgeActive && oppFlankExposed) {\n          mePower *= 2.1; oppPower *= 0.35; opp.lifted = 1.0;\n          opp.targetRoll = (Math.sin(opp.heading) * nz - Math.cos(opp.heading) * nx) > 0 ? 0.26 : -0.26;\n          opp.targetPitch = -0.15;\n          state.contactText = '\ud83d\udd25 \u5074\u93df\u547d\u4e2d\uff01'; state.advText = '\u6211\u65b9\u58d3\u5012\u6027\u512a\u52e2';\n        } else if (oppWedgeActive && meFlankExposed) {\n          oppPower *= 2.0; mePower *= 0.38; me.lifted = 1.0;\n          me.targetRoll = 0.24;\n          state.contactText = '\u26a0\ufe0f \u5074\u9762\u53d7\u64ca\uff01'; state.advText = '\u5371\u96aa\uff01\u5feb\u8f49\u93df\u5c0d\u6575';\n        } else {\n          const ratio = mePower / Math.max(1, oppPower);\n          if (ratio > 1.22) {\n            opp.lifted = 0.55; opp.targetPitch = -0.11;\n            state.contactText = '\u6b63\u9762\u786c\u63a8'; state.advText = '\u6211\u65b9\u63a8\u529b\u9818\u5148';\n          } else if (ratio < 0.82) {\n            me.lifted = 0.55; me.targetPitch = -0.11;\n            state.contactText = '\u6b63\u9762\u53d7\u58d3'; state.advText = '\u5c0d\u624b\u63a8\u529b\u9818\u5148';\n          } else {\n            state.contactText = '\u6b63\u9762\u9802\u6b7b\u50f5\u5c40'; state.advText = '\u6309 Space \u6ed1\u6b65\u7834\u5c40\uff01';\n            state.deadlockTime += dt;\n            if (state.deadlockTime > 1.2 && state.mode !== 'demo') {\n              showToast('\u26a0\ufe0f \u6b63\u9762\u9802\u6b7b\u50f5\u5c40\uff01\u6309 Space \u6ed1\u6b65\u7834\u5c40\u9a19\u5c0d\u624b\u524d\u64b2\u518d\u5207\u5074\u9762\uff01');\n            }\n          }\n        }\n\n        const totalP = mePower + oppPower;\n        me.x  -= nx * overlap * (oppPower / totalP);\n        me.z  -= nz * overlap * (oppPower / totalP);\n        opp.x += nx * overlap * (mePower  / totalP);\n        opp.z += nz * overlap * (mePower  / totalP);\n\n        const pushNet = (mePower - oppPower);\n        const pushSpeed = Math.max(-28, Math.min(28, pushNet * 0.24));\n        if (Math.abs(pushNet) > 15) {\n          const blend = Math.min(1, dt * 18);\n          if (pushNet > 0) {\n            const oppVn = opp.vx * nx + opp.vz * nz;\n            const dvN = (pushSpeed - oppVn) * blend;\n            opp.vx += nx * dvN; opp.vz += nz * dvN;\n            me.x += nx * pushSpeed * dt * 0.45; me.z += nz * pushSpeed * dt * 0.45;\n          } else {\n            const meVn = me.vx * nx + me.vz * nz;\n            const dvN = (pushSpeed - meVn) * blend;\n            me.vx += nx * dvN; me.vz += nz * dvN;\n            opp.x += nx * pushSpeed * dt * 0.45; opp.z += nz * pushSpeed * dt * 0.45;\n          }\n        }\n        const meSlip = (mFx * tx + mFz * tz) * 14.0 * dt;\n        me.x += tx * meSlip; me.z += tz * meSlip;\n\n        if (Math.hypot(me.vx - opp.vx, me.vz - opp.vz) > 14 && state.bumpCooldown <= 0) {\n          playBump(0.6); state.bumpCooldown = 0.25;\n        }\n      }\n\n      function resolveCupCollisions(dt) {\n        if (state.pose !== 'drill1') return;\n        let allOut = true;\n        for (const c of cups) {\n          if (c.out) {\n            c.vy -= 980 * dt;\n            c.fallY = Math.max(-ARENA_H, c.fallY + c.vy * dt);\n            c.x += c.vx * dt; c.z += c.vz * dt;\n            c.mesh.position.set(c.x, ARENA_H + c.fallY, c.z);\n            c.mesh.rotation.x += dt * 3.5;\n            continue;\n          }\n          allOut = false;\n          const dx = c.x - me.x, dz = c.z - me.z, dist = Math.hypot(dx, dz), minD = 11.2 + c.r;\n          if (dist < minD && dist > 0.01) {\n            const nx = dx / dist, nz = dz / dist;\n            c.x += nx * (minD - dist); c.z += nz * (minD - dist);\n            c.vx = me.vx * 1.15 + nx * 12; c.vz = me.vz * 1.15 + nz * 12;\n          }\n          c.x += c.vx * dt; c.z += c.vz * dt;\n          c.vx *= Math.max(0, 1 - 6.0 * dt); c.vz *= Math.max(0, 1 - 6.0 * dt);\n          c.mesh.position.set(c.x, ARENA_H, c.z);\n          if (Math.hypot(c.x, c.z) > ARENA_R + 1.5) { c.out = true; playTone(620, 0.09, 'triangle', 0.12); }\n        }\n        if (allOut && state.phase === 'running') {\n          finishRound('me', '\ud83c\udfaf \u6e96\u78ba\u5ea6\u8a13\u7df4\u904e\u95dc\uff01\u6240\u6709\u7d19\u676f\u5df2\u63a8\u51fa\u5834\u5730\u5916\uff01');\n        }\n      }\n\n      function checkRingOut() {\n        const checkBody = (b) => {\n          const r = Math.hypot(b.x, b.z);\n          if (r > 43.0 && !b.out) {\n            const outX = b.x / r, outZ = b.z / r;\n            const dot = Math.sin(b.heading) * outX + Math.cos(b.heading) * outZ;\n            b.targetPitch = dot * ((r - 43.0) / 5.0) * 0.25;\n          }\n          if (r > RING_OUT_EDGE && !b.out) {\n            b.out = true;\n            b.vx += (b.x / r) * 16; b.vz += (b.z / r) * 16;\n            b.targetPitch = 0.42;\n            return true;\n          }\n          return false;\n        };\n        const meFell = checkBody(me);\n        const oppFell = (state.pose !== 'drill1') ? checkBody(opp) : false;\n\n        if (state.phase === 'running') {\n          if (oppFell && !meFell) finishRound('me', `\ud83c\udfc6 \u52dd\u5229\uff01\u6210\u529f\u5c07\u3010${currentArch.name}\u3011\u63a8\u51fa\u64c2\u53f0\u5916\uff01`);\n          else if (meFell && !oppFell) finishRound('opp', '\u274c \u6211\u65b9\u63a5\u89f8\u64c2\u53f0\u5916\u570d\u843d\u6557\uff01');\n          else if (meFell && oppFell) finishRound('draw', '\u2696\ufe0f \u96d9\u65b9\u540c\u6642\u51fa\u754c\uff0c\u672c\u5c40\u548c\u5c40\uff01');\n        }\n      }\n\n      function finishRound(winner, msg) {\n        state.phase = 'round_over';\n        if (winner === 'me') { state.scoreMe++; playWin(true); showBanner('\u6211\u65b9\u52dd\u51fa\uff01', msg, 2800); }\n        else if (winner === 'opp') { state.scoreOpp++; playWin(false); showBanner('\u5c0d\u624b\u52dd\u51fa', msg, 2800); }\n        else { playTone(400, 0.2, 'sine', 0.12); showBanner('\u672c\u5c40\u548c\u5c40', msg, 2600); }\n        showToast(msg);\n        document.getElementById('btn-quick-replay').style.display = 'inline-flex';\n        updateScoreboardUI();\n      }\n\n      /* ================================================================\n       * 9. MESH SYNC & CAMERA ORBIT\n       * ================================================================ */\n      function syncMeshes() {\n        myVisual.root.position.set(me.x, me.y, me.z);\n        myVisual.root.rotation.order = 'YXZ';\n        myVisual.root.rotation.y = me.heading;\n        myVisual.root.rotation.x = me.pitch;\n        myVisual.root.rotation.z = me.roll;\n\n        oppVisual.root.position.set(opp.x, opp.y, opp.z);\n        oppVisual.root.rotation.order = 'YXZ';\n        oppVisual.root.rotation.y = opp.heading;\n        oppVisual.root.rotation.x = opp.pitch;\n        oppVisual.root.rotation.z = opp.roll;\n      }\n\n      let camMode = 'broadcast';\n      let orbitTheta = 0.0, orbitPhi = 0.68, orbitDist = 132;\n      let isDragging = false, lastMX = 0, lastMY = 0;\n\n      renderer.domElement.addEventListener('pointerdown', (e) => {\n        isDragging = true; lastMX = e.clientX; lastMY = e.clientY;\n      });\n      window.addEventListener('pointermove', (e) => {\n        if (!isDragging) return;\n        orbitTheta -= (e.clientX - lastMX) * 0.007;\n        orbitPhi = Math.max(0.15, Math.min(1.42, orbitPhi - (e.clientY - lastMY) * 0.006));\n        lastMX = e.clientX; lastMY = e.clientY;\n        camMode = 'broadcast';\n      });\n      window.addEventListener('pointerup', () => { isDragging = false; });\n      renderer.domElement.addEventListener('wheel', (e) => {\n        e.preventDefault();\n        orbitDist = Math.max(55, Math.min(210, orbitDist + e.deltaY * 0.08));\n      }, { passive: false });\n\n      function updateCamera(dt) {\n        let tx = 0, ty = ARENA_H, tz = 0, px, py, pz;\n        if (camMode === 'top') {\n          px = 0; py = 148; pz = 0.01;\n        } else if (camMode === 'chase') {\n          const fx = Math.sin(me.heading), fz = Math.cos(me.heading);\n          px = me.x - fx * 42; py = 26; pz = me.z - fz * 42;\n          tx = me.x + fx * 15; ty = ARENA_H + 3; tz = me.z + fz * 15;\n        } else {\n          px = Math.sin(orbitTheta) * Math.sin(orbitPhi) * orbitDist;\n          py = Math.cos(orbitPhi) * orbitDist + ARENA_H;\n          pz = Math.cos(orbitTheta) * Math.sin(orbitPhi) * orbitDist;\n        }\n        camera.position.lerp(new THREE.Vector3(px, py, pz), Math.min(1, dt * 8));\n        camera.lookAt(tx, ty, tz);\n      }\n\n      /* ================================================================\n       * 10. UI, SUB-PAGE DRAWER & EDGE CONTROLLER MODE SWITCHING\n       * ================================================================ */\n      const elBanner = document.getElementById('center-banner');\n      const elBannerMain = document.getElementById('banner-main');\n      const elBannerSub = document.getElementById('banner-sub');\n      const elToast = document.getElementById('toast-text');\n      const drawer = document.getElementById('subpage-drawer');\n      const backdrop = document.getElementById('drawer-backdrop');\n      let bannerTimeout = null;\n\n      function openDrawer(tab = 'tactics') {\n        playClick();\n        drawer.classList.add('open');\n        backdrop.classList.add('open');\n        switchDrawerTab(tab);\n      }\n      function closeDrawer() {\n        drawer.classList.remove('open');\n        backdrop.classList.remove('open');\n      }\n      function switchDrawerTab(tab) {\n        document.getElementById('tab-btn-tactics').classList.toggle('active-mode', tab === 'tactics');\n        document.getElementById('tab-btn-setup').classList.toggle('active-mode', tab === 'setup');\n        document.getElementById('tab-pane-tactics').classList.toggle('active', tab === 'tactics');\n        document.getElementById('tab-pane-setup').classList.toggle('active', tab === 'setup');\n      }\n\n      document.getElementById('btn-open-drawer').addEventListener('click', () => openDrawer('tactics'));\n      document.getElementById('btn-close-drawer').addEventListener('click', () => { playClick(); closeDrawer(); });\n      backdrop.addEventListener('click', closeDrawer);\n      document.getElementById('tab-btn-tactics').addEventListener('click', () => { playClick(); switchDrawerTab('tactics'); });\n      document.getElementById('tab-btn-setup').addEventListener('click', () => { playClick(); switchDrawerTab('setup'); });\n\n      function showBanner(main, sub, autoHideMs = 0) {\n        elBannerMain.textContent = main;\n        elBannerSub.textContent = sub || '';\n        elBanner.classList.add('visible');\n        if (bannerTimeout) clearTimeout(bannerTimeout);\n        if (autoHideMs > 0) bannerTimeout = setTimeout(() => elBanner.classList.remove('visible'), autoHideMs);\n      }\n      const hideBanner = () => elBanner.classList.remove('visible');\n      const showToast = (txt) => { elToast.textContent = txt; };\n\n      const POSE_LABELS = { left: '\u9762\u5411\u5de6', right: '\u9762\u5411\u53f3', back: '\u9762\u5411\u5f8c', front: '\u9762\u5411\u524d', edge: '\u908a\u7de3\u81ea\u6551', drill1: '\u7d19\u676f\u5854' };\n\n      function updateScoreboardUI() {\n        document.getElementById('score-me').textContent = state.scoreMe;\n        document.getElementById('score-opp').textContent = state.scoreOpp;\n        document.getElementById('score-opp-name').textContent = state.pose === 'drill1' ? '\u7d19\u676f\u5854' : currentArch.name;\n        const elTimer = document.getElementById('timer-display');\n        elTimer.textContent = state.timer.toFixed(1);\n        elTimer.classList.toggle('warn', state.timer <= 15 && state.timer > 5);\n        elTimer.classList.toggle('danger', state.timer <= 5);\n        document.getElementById('round-display').textContent = `\u7b2c${state.round}\u5c40 \u00b7 ${POSE_LABELS[state.pose] || state.pose}`;\n      }\n\n      function setControlMode(mode) {\n        state.ctrlMode = mode;\n        const isTank = (mode === 'tank');\n        // Left/Right Edge Tank vs Left-Only Arcade (Right side COMPLETELY EMPTY!)\n        document.getElementById('edge-left-tank').classList.toggle('hidden', !isTank);\n        document.getElementById('edge-right-tank').classList.toggle('hidden', !isTank);\n        document.getElementById('edge-left-arcade').classList.toggle('hidden', isTank);\n\n        document.getElementById('ctrl-tank').classList.toggle('active-mode', isTank);\n        document.getElementById('ctrl-arcade').classList.toggle('active-mode', !isTank);\n        document.getElementById('btn-ctrl-toggle').textContent = isTank ? '\u96d9\u9375 1/2' : '\u5de6\u5074\u55ae\u6416\u687f';\n      }\n\n      document.getElementById('btn-ctrl-toggle').addEventListener('click', () => {\n        playClick();\n        setControlMode(state.ctrlMode === 'tank' ? 'arcade' : 'tank');\n        showToast(state.ctrlMode === 'tank'\n          ? '\u5df2\u5207\u63db\u3010\u5de6\u53f3\u96d9\u908a 1/2 \u9375\u624b\u63a3\u3011\u6a21\u5f0f\uff08\u9069\u5408 iPad \u96d9\u624b\u908a\u7de3\u64cd\u63a7\uff09'\n          : '\u5df2\u5207\u63db\u3010\u5de6\u5074\u55ae\u6416\u687f\u3011\u6a21\u5f0f\uff08\u53f3\u5074\u756b\u9762\u5b8c\u5168\u7559\u7a7a\uff01\uff09');\n      });\n      document.getElementById('ctrl-tank').addEventListener('click', () => { playClick(); setControlMode('tank'); });\n      document.getElementById('ctrl-arcade').addEventListener('click', () => { playClick(); setControlMode('arcade'); });\n\n      function selectArchetype(archId) {\n        if (!ARCHETYPES[archId]) return;\n        currentArch = ARCHETYPES[archId];\n        scene.remove(oppVisual.root);\n        oppVisual = buildOpponentMesh(currentArch);\n        scene.add(oppVisual.root);\n        opp.spec = currentArch;\n        document.querySelectorAll('.arch-card').forEach(c => c.classList.toggle('selected', c.dataset.arch === archId));\n        applyStartPose(state.pose === 'drill1' ? 'left' : state.pose);\n      }\n\n      function loadTactic(tacticId, autoRunDemo = false) {\n        const tac = TACTICS[tacticId];\n        if (!tac) return;\n        state.activeTactic = tacticId;\n\n        if (tac.arch !== 'cups') {\n          currentArch = ARCHETYPES[tac.arch];\n          scene.remove(oppVisual.root);\n          oppVisual = buildOpponentMesh(currentArch);\n          scene.add(oppVisual.root);\n          opp.spec = currentArch;\n          document.querySelectorAll('.arch-card').forEach(c => c.classList.toggle('selected', c.dataset.arch === tac.arch));\n        }\n\n        document.querySelectorAll('.tac-btn').forEach(b => b.classList.toggle('selected', b.id === `tac-${tacticId}`));\n        document.querySelectorAll('[data-pose]').forEach(b => b.classList.toggle('active-mode', b.dataset.pose === tac.pose));\n\n        applyStartPose(tac.pose);\n        rebuildTacticalArrows(tacticId);\n\n        document.getElementById('strat-name').textContent = tac.title;\n        document.getElementById('strat-status').textContent = autoRunDemo ? 'AUTO DEMO' : 'READY';\n        document.getElementById('strat-steps').innerHTML = tac.steps.map((s, i) => `<li class=\"${i === 0 ? 'active-step' : ''}\">${s}</li>`).join('');\n        showToast(tac.toast);\n\n        if (autoRunDemo) {\n          closeDrawer(); // Close sub-page automatically so 3D arena is 100% unobstructed!\n          startMatch('demo');\n        }\n      }\n\n      function startMatch(runMode = 'duel') {\n        playClick();\n        closeDrawer();\n        state.mode = runMode;\n        document.getElementById('btn-quick-replay').style.display = 'none';\n        applyStartPose(state.pose);\n        if (runMode === 'demo') {\n          state.phase = 'running';\n          hideBanner();\n          playCountdown(true);\n          document.getElementById('strat-status').textContent = 'RUNNING';\n          showToast(`\u25b6 \u81ea\u52d5\u793a\u7bc4\uff1a${TACTICS[state.activeTactic].title}`);\n        } else {\n          state.phase = 'countdown';\n          state.countdownVal = 3;\n          state.countdownAcc = 0;\n          showBanner('3', '\u96d9\u65b9\u8cbc\u9f4a\u9ed1\u7dda\u5f8c\u65b9\uff0c\u807d\u5230 GO \u7acb\u5373\u555f\u52d5\uff01');\n          playCountdown(false);\n        }\n      }\n\n      // Wire Buttons\n      document.getElementById('btn-start').addEventListener('click', () => startMatch('duel'));\n      document.getElementById('btn-quick-replay').addEventListener('click', () => startMatch(state.mode));\n      document.getElementById('btn-reset-round').addEventListener('click', () => {\n        playClick(); state.phase = 'idle'; hideBanner();\n        document.getElementById('btn-quick-replay').style.display = 'none';\n        applyStartPose(state.pose);\n        showToast('\u672c\u5c40\u5df2\u91cd\u7f6e\uff0c\u96d9\u65b9\u8cbc\u9f4a\u4e2d\u5fc3\u9ed1\u7dda\u5f8c\u65b9\u3002');\n      });\n      document.getElementById('btn-reset-match').addEventListener('click', () => {\n        playClick(); state.phase = 'idle'; state.round = 1; state.scoreMe = 0; state.scoreOpp = 0;\n        hideBanner(); applyStartPose('left'); closeDrawer();\n        showToast('\u5df2\u958b\u555f\u65b0\u5834\u6b21\uff083 \u5c40 2 \u52dd\u5236\uff09\u3002');\n      });\n      document.getElementById('btn-mute').addEventListener('click', (e) => {\n        isMuted = !isMuted; e.currentTarget.textContent = isMuted ? '\ud83d\udd07' : '\ud83d\udd0a';\n      });\n\n      document.querySelectorAll('.arch-card').forEach(card => {\n        card.addEventListener('click', () => {\n          playClick(); state.phase = 'idle'; hideBanner(); selectArchetype(card.dataset.arch);\n        });\n      });\n\n      document.getElementById('sl-opp-spd').addEventListener('input', (e) => {\n        state.oppSpeedMult = Number(e.target.value) / 100;\n        document.getElementById('val-opp-spd').textContent = `${e.target.value}%`;\n      });\n      document.getElementById('sl-opp-trq').addEventListener('input', (e) => {\n        state.oppTorqueMult = Number(e.target.value) / 100;\n        document.getElementById('val-opp-trq').textContent = `${e.target.value}%`;\n      });\n\n      document.querySelectorAll('[data-pose]').forEach(btn => {\n        btn.addEventListener('click', () => {\n          playClick(); state.phase = 'idle'; hideBanner();\n          document.querySelectorAll('[data-pose]').forEach(b => b.classList.remove('active-mode'));\n          btn.classList.add('active-mode');\n          applyStartPose(btn.dataset.pose);\n          if (currentArch.id === 'fast' && (btn.dataset.pose === 'left' || btn.dataset.pose === 'right')) rebuildTacticalArrows('fast-lr');\n          else if (currentArch.id === 'fast' && btn.dataset.pose === 'back') rebuildTacticalArrows('fast-back');\n          else if (currentArch.id === 'slow' && btn.dataset.pose === 'front') rebuildTacticalArrows('slow-feint');\n          else rebuildTacticalArrows('');\n        });\n      });\n\n      document.getElementById('btn-rand-pose').addEventListener('click', () => {\n        playClick();\n        const poses = ['left', 'right', 'back'];\n        const pick = poses[Math.floor(Math.random() * poses.length)];\n        document.getElementById(`pose-${pick}`).click();\n        showToast(`\ud83c\udfb2 \u5927\u6703\u96a8\u6a5f\u62bd\u7c64\u958b\u5c40\u65b9\u5411\uff1a\u3010${POSE_LABELS[pick]}\u3011`);\n      });\n\n      ['fast-lr', 'fast-back', 'slow-45', 'slow-feint', 'edge-save', 'cup-drill'].forEach(id => {\n        document.getElementById(`tac-${id}`).addEventListener('click', () => { playClick(); loadTactic(id, false); });\n      });\n\n      document.getElementById('btn-auto-demo').addEventListener('click', () => loadTactic(state.activeTactic, true));\n      document.getElementById('btn-manual-drill').addEventListener('click', () => { loadTactic(state.activeTactic, false); startMatch('duel'); });\n\n      // Camera pills\n      const setCamActive = (id) => ['cam-broadcast', 'cam-top', 'cam-chase'].forEach(k => document.getElementById(k).classList.toggle('active', k === id));\n      document.getElementById('cam-broadcast').addEventListener('click', () => { playClick(); camMode = 'broadcast'; orbitTheta = 0; orbitPhi = 0.68; orbitDist = 132; setCamActive('cam-broadcast'); });\n      document.getElementById('cam-top').addEventListener('click', () => { playClick(); camMode = 'top'; setCamActive('cam-top'); });\n      document.getElementById('cam-chase').addEventListener('click', () => { playClick(); camMode = 'chase'; setCamActive('cam-chase'); });\n      document.getElementById('btn-toggle-vectors').addEventListener('click', (e) => {\n        playClick(); showVectors = !showVectors;\n        e.currentTarget.textContent = showVectors ? '\u7bad\u982d ON' : '\u7bad\u982d OFF';\n        e.currentTarget.classList.toggle('active', showVectors);\n        safeRingGroup.visible = showVectors;\n        rebuildTacticalArrows(state.activeTactic);\n      });\n\n      [['spd-05', 0.5], ['spd-10', 1.0], ['spd-15', 1.5]].forEach(([id, val]) => {\n        document.getElementById(id).addEventListener('click', () => {\n          playClick(); state.simSpeed = val;\n          ['spd-05', 'spd-10', 'spd-15'].forEach(k => document.getElementById(k).classList.toggle('active', k === id));\n        });\n      });\n\n      const bindHold = (id, setter) => {\n        const el = document.getElementById(id);\n        el.addEventListener('pointerdown', (e) => { e.stopPropagation(); setter(true); });\n        el.addEventListener('pointerup', () => setter(false));\n        el.addEventListener('pointerleave', () => setter(false));\n        el.addEventListener('pointercancel', () => setter(false));\n      };\n      bindHold('btn-move-back-l', v => { holdBtnLeftBack = v; });\n      bindHold('btn-move-back-r', v => { holdBtnRightBack = v; });\n      document.getElementById('btn-move-feint').addEventListener('click', () => { closeDrawer(); if (state.phase === 'running') triggerFeintMove(); else showToast('\u8acb\u5148\u6309\u300c\u25b6 3-2-1 \u958b\u8cfd\u300d\u958b\u59cb\u6bd4\u8cfd\uff01'); });\n      document.getElementById('btn-move-feint-arcade').addEventListener('click', () => { if (state.phase === 'running') triggerFeintMove(); else showToast('\u8acb\u5148\u6309\u300c\u25b6 3-2-1 \u958b\u8cfd\u300d\u958b\u59cb\u6bd4\u8cfd\uff01'); });\n\n      /* ================================================================\n       * 11. MAIN ANIMATION LOOP\n       * ================================================================ */\n      let lastTime = performance.now();\n      const FIXED_DT = 1 / 120;\n      let acc = 0;\n\n      function animate(now) {\n        requestAnimationFrame(animate);\n        const rawDt = Math.min(0.05, (now - lastTime) / 1000);\n        lastTime = now;\n\n        if (state.phase === 'countdown') {\n          state.countdownAcc += rawDt;\n          if (state.countdownAcc >= 0.78) {\n            state.countdownAcc = 0;\n            state.countdownVal--;\n            if (state.countdownVal > 0) {\n              showBanner(String(state.countdownVal), '\u6e96\u5099\u555f\u52d5\uff01');\n              playCountdown(false);\n            } else {\n              state.phase = 'running';\n              showBanner('GO!', '\u5168\u901f\u57f7\u884c\u7b56\u7565\uff01', 650);\n              playCountdown(true);\n            }\n          }\n        }\n\n        acc += rawDt * state.simSpeed;\n        while (acc >= FIXED_DT) {\n          acc -= FIXED_DT;\n          if (state.bumpCooldown > 0) state.bumpCooldown -= FIXED_DT;\n          if (state.feintTimer > 0) state.feintTimer -= FIXED_DT;\n\n          if (state.phase === 'running') {\n            state.matchElapsed += FIXED_DT;\n            state.timer = Math.max(0, state.timer - FIXED_DT);\n\n            const myCmd = state.mode === 'demo' ? getDemoPlayerCommands() : getManualCommands();\n            const oppCmd = getOpponentCommands();\n            me.leftCmd = myCmd.l; me.rightCmd = myCmd.r;\n            opp.leftCmd = oppCmd.l; opp.rightCmd = oppCmd.r;\n\n            stepBodyDrive(me, FIXED_DT, 1.0);\n            stepBodyDrive(opp, FIXED_DT, state.oppSpeedMult);\n            resolveRobotCollision(FIXED_DT);\n            resolveCupCollisions(FIXED_DT);\n            checkRingOut();\n\n            if (state.timer <= 0 && state.phase === 'running') {\n              finishRound('draw', '\u23f1 60 \u79d2\u6642\u9593\u5230\uff01\u672c\u5c40\u548c\u5c40\u3002');\n            }\n          } else if (state.phase === 'round_over') {\n            me.leftCmd = 0; me.rightCmd = 0; opp.leftCmd = 0; opp.rightCmd = 0;\n            stepBodyDrive(me, FIXED_DT, 1.0);\n            stepBodyDrive(opp, FIXED_DT, 1.0);\n          }\n        }\n\n        // Visual wheel & gear spin\n        if (state.phase === 'running') {\n          const dtV = rawDt * state.simSpeed;\n          myVisual.wheelL.rotation.x += (me.leftCmd * me.spec.maxSpeed / 2.8) * dtV;\n          myVisual.wheelR.rotation.x += (me.rightCmd * me.spec.maxSpeed / 2.8) * dtV;\n          myVisual.gearL.rotation.x  += (me.leftCmd * me.spec.maxSpeed / 2.8) * 1.67 * dtV;\n          myVisual.gearR.rotation.x  += (me.rightCmd * me.spec.maxSpeed / 2.8) * 1.67 * dtV;\n          oppVisual.wheelL.rotation.x += (opp.leftCmd * opp.spec.maxSpeed / 2.8) * dtV;\n          oppVisual.wheelR.rotation.x += (opp.rightCmd * opp.spec.maxSpeed / 2.8) * dtV;\n        }\n\n        syncMeshes();\n        updateCamera(rawDt);\n        updateScoreboardUI();\n\n        // Sync visual tank knobs (range 6px .. 52px .. 98px)\n        const trackH = document.getElementById('stick-left-track').clientHeight || 158;\n        const centerTop = (trackH - 50) / 2;\n        const travel = centerTop - 6;\n        document.getElementById('stick-left-knob').style.top  = `${centerTop - me.leftCmd * travel}px`;\n        document.getElementById('stick-right-knob').style.top = `${centerTop - me.rightCmd * travel}px`;\n\n        // Update Telemetry inside Drawer\n        document.getElementById('tele-my-spd').textContent  = `${Math.hypot(me.vx, me.vz).toFixed(1)} cm/s`;\n        document.getElementById('tele-opp-spd').textContent = `${Math.hypot(opp.vx, opp.vz).toFixed(1)} cm/s`;\n        document.getElementById('tele-contact').textContent = state.contactText;\n        document.getElementById('tele-adv').textContent     = state.advText;\n\n        // Zone HUD pill\n        const rMe = Math.hypot(me.x, me.z);\n        const zoneLed = document.getElementById('led-zone');\n        const zoneTxt = document.getElementById('hud-zone-text');\n        if (rMe <= SAFE_ZONE_R) {\n          zoneLed.className = 'led-dot green';\n          zoneTxt.textContent = `\u5b89\u5168\u5340 \u00b7 R=${rMe.toFixed(0)}cm`;\n        } else if (rMe <= DANGER_ZONE_R) {\n          zoneLed.className = 'led-dot';\n          zoneTxt.textContent = `\u26a0\ufe0f \u7d05\u5708\u5371\u96aa \u00b7 R=${rMe.toFixed(0)}cm`;\n        } else {\n          zoneLed.className = 'led-dot';\n          zoneTxt.textContent = `\ud83d\udea8 \u9ed1\u908a\u5feb\u7529\u5c3e \u00b7 R=${rMe.toFixed(0)}cm`;\n        }\n\n        renderer.render(scene, camera);\n      }\n\n      window.addEventListener('resize', () => {\n        const w = host.clientWidth, h = Math.max(host.clientHeight, 1);\n        camera.aspect = w / h;\n        camera.updateProjectionMatrix();\n        renderer.setSize(w, h);\n      });\n\n      // Boot: behind-black-line Left pose, Tank 1/2 iPad edge controls ready!\n      setControlMode('tank');\n      loadTactic('fast-lr', false);\n      requestAnimationFrame(animate);\n    })();\n  <\/script>\n</body>\n</html>\n";

ink-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n    .bom-code { font-family: var(--font-mono); font-size: 9.5px; color: var(--ink-secondary); }\n\n    /* TOP-RIGHT CONTROLS */\n    .corner-tr {\n      position: absolute; top: 12px; right: 12px;\n      display: flex; flex-direction: column; align-items: flex-end; gap: 7px; z-index: 15;\n    }\n    .ctrl-pill-row { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }\n    .hud-btn {\n      appearance: none; background: rgba(20, 24, 29, 0.88);\n      border: 1px solid rgba(255,255,255,0.18); color: #f1f5f9;\n      font-family: var(--font-ui); font-size: 11px; font-weight: 600;\n      padding: 5px 9px; border-radius: 6px; cursor: pointer; backdrop-filter: blur(6px);\n    }\n    .hud-btn.active { background: var(--accent-orange); border-color: #ff7c40; color: #ffffff; }\n\n    .ghost-box {\n      background: var(--card-bg); border: 1.5px solid var(--card-border);\n      border-radius: 9px; padding: 8px 10px;\n      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);\n      backdrop-filter: blur(8px);\n      display: flex; flex-direction: column; gap: 6px; width: 224px;\n    }\n    .ghost-row {\n      display: flex; align-items: center; justify-content: space-between;\n      font-family: var(--font-mono); font-size: 10px; font-weight: 700; color: var(--ink-secondary);\n    }\n    input[type=\"range\"] {\n      -webkit-appearance: none; width: 100%; height: 6px; border-radius: 3px;\n      background: #475569; outline: none;\n    }\n    input[type=\"range\"]::-webkit-slider-thumb {\n      -webkit-appearance: none; width: 16px; height: 16px; border-radius: 4px;\n      background: var(--accent-orange); border: 2px solid #ffffff; cursor: pointer;\n    }\n\n    /* BOTTOM DOCK (Independent Module Tabs + Step Slider) */\n    .bottom-dock {\n      flex-shrink: 0;\n      background: var(--dock-bg);\n      border-top: 1.5px solid var(--bar-border);\n      padding: 8px
