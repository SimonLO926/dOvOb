      'use strict';
      const SIM_HTML = "<!DOCTYPE html>\n<html lang=\"zh-Hant\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover\" />\n  <title>SRC 2027 \u7fbd\u91cf\u7d1a\u9059\u63a7\u76f8\u64b2 3D \u6a21\u64ec\u5668 \u2014 iPad \u96d9\u908a\u64cd\u63a7\u7248</title>\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\" />\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin />\n  <link href=\"https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Space+Grotesk:wght@500;600;700&display=swap\" rel=\"stylesheet\" />\n  <script src=\"./assets/macau/three-r128.min.js\"><\/script>\n  <style>\n    :root {\n      /* 03 - Tactile Industrial (Braun / Teenage Engineering) */\n      --bg-mat: #202220;\n      --chassis-fill: linear-gradient(180deg, #e7e5df 0%, #d6d3cb 100%);\n      --chassis-border: #b0ada5;\n      --chassis-shadow:\n        0 14px 32px rgba(0, 0, 0, 0.32),\n        0 3px 0 #96938b,\n        inset 0 1.5px 0 rgba(255, 255, 255, 0.85);\n\n      --screen-bg: #161b17;\n      --screen-border: #a5a299;\n      --screen-shadow:\n        inset 0 4px 10px rgba(0, 0, 0, 0.82),\n        0 1px 0 rgba(255, 255, 255, 0.72);\n      --screen-ink: #e8f5e9;\n      --screen-muted: #78937d;\n      --screen-amber: #fbbf24;\n      --screen-red: #f87171;\n      --screen-green: #4ade80;\n\n      --ink-primary: #1f201e;\n      --ink-secondary: #56544e;\n      --ink-silk: #6d6a63;\n\n      --key-light-bg: linear-gradient(180deg, #f8f7f3 0%, #e9e6df 100%);\n      --key-light-shadow: 0 3px 0 #9e9b93, 0 4px 7px rgba(0,0,0,0.18), inset 0 1px 0 #ffffff;\n      --key-light-active: 0 1px 0 #9e9b93, 0 2px 3px rgba(0,0,0,0.16), inset 0 1px 0 #ffffff;\n\n      --key-dark-bg: linear-gradient(180deg, #4b4b47 0%, #373734 100%);\n      --key-dark-shadow: 0 3px 0 #1f1f1d, 0 4px 7px rgba(0,0,0,0.24), inset 0 1px 0 rgba(255,255,255,0.16);\n      --key-dark-active: 0 1px 0 #1f1f1d, 0 2px 3px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.16);\n\n      --accent-orange: #ff4f00;\n      --key-orange-bg: linear-gradient(180deg, #ff5e14 0%, #e34500 100%);\n      --key-orange-shadow: 0 3px 0 #992e00, 0 4px 9px rgba(227,69,0,0.30), inset 0 1px 0 rgba(255,255,255,0.38);\n      --key-orange-active: 0 1px 0 #992e00, 0 2px 4px rgba(227,69,0,0.28), inset 0 1px 0 rgba(255,255,255,0.38);\n\n      --hairline: 1px solid rgba(0, 0, 0, 0.12);\n      --font-ui: 'Space Grotesk', 'Noto Sans TC', sans-serif;\n      --font-mono: 'JetBrains Mono', 'Noto Sans TC', monospace;\n    }\n\n    * {\n      box-sizing: border-box;\n      margin: 0;\n      padding: 0;\n      user-select: none;\n      -webkit-user-select: none;\n      -webkit-touch-callout: none;\n    }\n\n    html, body {\n      width: 100%;\n      height: 100%;\n      overflow: hidden;\n      background: var(--bg-mat);\n      color: var(--ink-primary);\n      font-family: var(--font-ui);\n      touch-action: none;\n    }\n\n    /* Full-Viewport Layout: Slim Top Bar + Unobstructed 3D Arena */\n    .app-root {\n      display: flex;\n      flex-direction: column;\n      width: 100vw;\n      height: 100vh;\n      height: 100dvh;\n      overflow: hidden;\n    }\n\n    /* TOP HARDWARE BAR (Compact, Zero Overlap) */\n    .top-bar {\n      height: 52px;\n      flex-shrink: 0;\n      background: var(--chassis-fill);\n      border-bottom: 1.5px solid var(--chassis-border);\n      box-shadow: 0 3px 12px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.85);\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      padding: 0 12px;\n      gap: 10px;\n      z-index: 30;\n    }\n\n    .bar-left, .bar-right {\n      display: flex;\n      align-items: center;\n      gap: 7px;\n      min-width: 0;\n    }\n\n    .brand-badge {\n      background: var(--ink-primary);\n      color: #f8f7f3;\n      font-family: var(--font-mono);\n      font-weight: 700;\n      font-size: 11px;\n      letter-spacing: 0.08em;\n      padding: 4px 8px;\n      border-radius: 5px;\n      display: inline-flex;\n      align-items: center;\n      gap: 6px;\n      white-space: nowrap;\n    }\n\n    .led-dot {\n      width: 7px;\n      height: 7px;\n      border-radius: 50%;\n      background: var(--accent-orange);\n      box-shadow: 0 0 8px rgba(255, 79, 0, 0.78);\n      display: inline-block;\n      flex-shrink: 0;\n    }\n    .led-dot.green {\n      background: #22c55e;\n      box-shadow: 0 0 8px rgba(34, 197, 94, 0.75);\n    }\n\n    /* Center Recessed OLED Scoreboard */\n    .oled-scoreboard {\n      background: var(--screen-bg);\n      border: 1.5px solid var(--screen-border);\n      border-radius: 7px;\n      box-shadow: var(--screen-shadow);\n      padding: 3px 12px;\n      display: flex;\n      align-items: center;\n      gap: 12px;\n      color: var(--screen-ink);\n      font-family: var(--font-mono);\n      font-variant-numeric: tabular-nums;\n      height: 36px;\n      white-space: nowrap;\n    }\n\n    .score-pair {\n      display: flex;\n      align-items: center;\n      gap: 6px;\n      font-size: 12px;\n      font-weight: 700;\n    }\n    .score-tag {\n      font-size: 10px;\n      color: var(--screen-muted);\n    }\n    .score-num {\n      font-size: 16px;\n      min-width: 12px;\n      text-align: center;\n    }\n    .score-num.me { color: #ff7b3b; }\n    .score-num.opp { color: #60a5fa; }\n\n    .timer-readout {\n      font-size: 17px;\n      font-weight: 700;\n      color: var(--screen-green);\n      min-width: 54px;\n      text-align: center;\n      border-left: 1px solid rgba(255,255,255,0.14);\n      border-right: 1px solid rgba(255,255,255,0.14);\n      padding: 0 10px;\n    }\n    .timer-readout.warn { color: var(--screen-amber); }\n    .timer-readout.danger { color: var(--screen-red); }\n\n    .round-badge {\n      font-size: 10.5px;\n      color: #d7e6da;\n    }\n\n    /* 3D Physical Keycaps */\n    .keycap {\n      appearance: none;\n      border: none;\n      border-radius: 7px;\n      background: var(--key-light-bg);\n      color: var(--ink-primary);\n      box-shadow: var(--key-light-shadow);\n      font-family: var(--font-ui);\n      font-weight: 600;\n      font-size: 12px;\n      padding: 6px 10px;\n      cursor: pointer;\n      display: inline-flex;\n      align-items: center;\n      justify-content: center;\n      gap: 5px;\n      white-space: nowrap;\n      transition: transform 60ms ease, box-shadow 60ms ease;\n    }\n    .keycap:active, .keycap.pressed {\n      transform: translateY(2px);\n      box-shadow: var(--key-light-active);\n    }\n    .keycap.dark {\n      background: var(--key-dark-bg);\n      color: #f4f3ef;\n      box-shadow: var(--key-dark-shadow);\n    }\n    .keycap.dark:active, .keycap.dark.pressed {\n      box-shadow: var(--key-dark-active);\n    }\n    .keycap.orange {\n      background: var(--key-orange-bg);\n      color: #ffffff;\n      box-shadow: var(--key-orange-shadow);\n    }\n    .keycap.orange:active, .keycap.orange.pressed {\n      box-shadow: var(--key-orange-active);\n    }\n    .keycap.sm {\n      font-size: 11px;\n      padding: 5px 8px;\n      border-radius: 6px;\n    }\n    .keycap.active-mode {\n      background: var(--key-dark-bg);\n      color: #ffffff;\n      box-shadow: var(--key-dark-shadow);\n    }\n    .keycap.active-mode::before {\n      content: '';\n      width: 6px;\n      height: 6px;\n      border-radius: 50%;\n      background: var(--accent-orange);\n      box-shadow: 0 0 6px var(--accent-orange);\n    }\n\n    /* FULL-SCREEN 3D STAGE */\n    .stage-wrap {\n      position: relative;\n      flex: 1;\n      width: 100%;\n      min-height: 0;\n      background: #202220;\n      overflow: hidden;\n    }\n    #canvas-host {\n      width: 100%;\n      height: 100%;\n      display: block;\n    }\n\n    /* Minimal Non-Overlapping Corner Pills */\n    .corner-tl {\n      position: absolute;\n      top: 10px;\n      left: 12px;\n      display: flex;\n      align-items: center;\n      gap: 6px;\n      z-index: 12;\n      flex-wrap: wrap;\n      max-width: 48%;\n    }\n    .corner-tr {\n      position: absolute;\n      top: 10px;\n      right: 12px;\n      display: flex;\n      align-items: center;\n      gap: 6px;\n      z-index: 12;\n    }\n\n    .hud-pill {\n      background: rgba(22, 27, 23, 0.84);\n      border: 1px solid rgba(255,255,255,0.16);\n      color: #e8f5e9;\n      font-family: var(--font-mono);\n      font-size: 10.5px;\n      padding: 5px 9px;\n      border-radius: 6px;\n      backdrop-filter: blur(6px);\n      display: inline-flex;\n      align-items: center;\n      gap: 6px;\n      font-variant-numeric: tabular-nums;\n    }\n\n    .hud-btn {\n      appearance: none;\n      background: rgba(22, 27, 23, 0.84);\n      border: 1px solid rgba(255,255,255,0.18);\n      color: #e8f5e9;\n      font-family: var(--font-ui);\n      font-size: 11px;\n      font-weight: 600;\n      padding: 5px 9px;\n      border-radius: 6px;\n      cursor: pointer;\n      backdrop-filter: blur(6px);\n      transition: background 120ms ease, border-color 120ms ease;\n    }\n    .hud-btn:hover { background: rgba(38, 46, 40, 0.92); }\n    .hud-btn.active {\n      background: var(--accent-orange);\n      border-color: #ff7c40;\n      color: #ffffff;\n    }\n\n    /* Big Center Countdown / Result Banner */\n    .center-banner {\n      position: absolute;\n      top: 44%;\n      left: 50%;\n      transform: translate(-50%, -50%) scale(0.92);\n      background: rgba(20, 24, 21, 0.94);\n      border: 2px solid var(--accent-orange);\n      border-radius: 14px;\n      padding: 16px 30px;\n      text-align: center;\n      color: #ffffff;\n      pointer-events: none;\n      opacity: 0;\n      transition: opacity 150ms ease, transform 150ms ease;\n      z-index: 25;\n      box-shadow: 0 18px 44px rgba(0,0,0,0.58);\n      max-width: 82%;\n    }\n    .center-banner.visible {\n      opacity: 1;\n      transform: translate(-50%, -50%) scale(1);\n    }\n    .banner-main {\n      font-size: 32px;\n      font-weight: 900;\n      letter-spacing: 0.04em;\n    }\n    .banner-sub {\n      margin-top: 5px;\n      font-size: 13px;\n      color: #cbd5e1;\n    }\n\n    /* Compact Bottom-Center Status Bar (Never collides with edge controls!) */\n    .bottom-status-bar {\n      position: absolute;\n      bottom: 14px;\n      left: 50%;\n      transform: translateX(-50%);\n      background: rgba(22, 27, 23, 0.88);\n      border: 1px solid rgba(255,255,255,0.16);\n      border-radius: 9px;\n      padding: 6px 12px;\n      display: flex;\n      align-items: center;\n      gap: 10px;\n      color: #e8f5e9;\n      font-size: 12px;\n      z-index: 16;\n      max-width: calc(100vw - 320px);\n      backdrop-filter: blur(6px);\n      box-shadow: 0 8px 20px rgba(0,0,0,0.35);\n    }\n    .status-text {\n      white-space: nowrap;\n      overflow: hidden;\n      text-overflow: ellipsis;\n    }\n\n    /* ============================================================\n     * IPAD-STYLE FLOATING EDGE CONTROLLERS\n     *   Tank Mode: Left edge = Stick 1 (L), Right edge = Stick 2 (R)\n     *   Arcade Mode: Left edge ONLY = 360\u00b0 Analog Stick, Right side EMPTY!\n     * ============================================================ */\n    .edge-ctrl {\n      position: absolute;\n      bottom: 24px;\n      z-index: 20;\n      display: flex;\n      flex-direction: column;\n      align-items: center;\n      gap: 8px;\n      pointer-events: auto;\n    }\n    .edge-ctrl.left  { left: 20px; }\n    .edge-ctrl.right { right: 20px; }\n    .edge-ctrl.hidden { display: none !important; }\n\n    /* Vertical Tank Lever Housing (Makerzoid 1 / 2 Style) */\n    .tank-pad {\n      width: 84px;\n      padding: 10px 0;\n      border-radius: 42px;\n      background: rgba(229, 227, 221, 0.86);\n      border: 2px solid rgba(176, 173, 165, 0.95);\n      box-shadow: 0 10px 26px rgba(0,0,0,0.36), inset 0 1.5px 0 rgba(255,255,255,0.8);\n      backdrop-filter: blur(8px);\n      display: flex;\n      flex-direction: column;\n      align-items: center;\n      gap: 6px;\n    }\n\n    .tank-track {\n      width: 60px;\n      height: 158px;\n      border-radius: 30px;\n      background: linear-gradient(180deg, #272b28 0%, #1a1d1b 100%);\n      border: 2px solid #8c8981;\n      box-shadow: inset 0 4px 12px rgba(0,0,0,0.75);\n      position: relative;\n      touch-action: none;\n      cursor: ns-resize;\n    }\n    .tank-track::before, .tank-track::after {\n      position: absolute;\n      left: 50%;\n      transform: translateX(-50%);\n      font-family: var(--font-mono);\n      font-size: 11px;\n      color: rgba(255,255,255,0.32);\n      pointer-events: none;\n    }\n    .tank-track::before { content: '\u25b2'; top: 8px; }\n    .tank-track::after  { content: '\u25bc'; bottom: 8px; }\n\n    .tank-knob {\n      width: 50px;\n      height: 50px;\n      border-radius: 50%;\n      background: linear-gradient(180deg, #ff6c26 0%, #e04400 100%);\n      border: 2px solid #ffd4be;\n      box-shadow: 0 5px 12px rgba(0,0,0,0.45), inset 0 2px 2px rgba(255,255,255,0.45);\n      position: absolute;\n      left: 3px;\n      top: 52px; /* center = 52px, range 6px..98px */\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      font-family: var(--font-mono);\n      font-weight: 700;\n      font-size: 16px;\n      color: #ffffff;\n      pointer-events: none;\n    }\n    .tank-knob.right-stick {\n      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);\n      border-color: #e0f2fe;\n    }\n\n    .ctrl-caption {\n      font-family: var(--font-mono);\n      font-size: 10px;\n      font-weight: 700;\n      color: var(--ink-primary);\n      letter-spacing: 0.05em;\n    }\n\n    /* 360\u00b0 Single Analog Joystick (Arcade Mode - Left Edge ONLY) */\n    .arcade-pad {\n      width: 156px;\n      height: 156px;\n      border-radius: 50%;\n      background: rgba(229, 227, 221, 0.84);\n      border: 2.5px solid rgba(176, 173, 165, 0.95);\n      box-shadow: 0 12px 30px rgba(0,0,0,0.42), inset 0 2px 0 rgba(255,255,255,0.8);\n      backdrop-filter: blur(8px);\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      position: relative;\n      touch-action: none;\n      cursor: move;\n    }\n    .arcade-well {\n      width: 132px;\n      height: 132px;\n      border-radius: 50%;\n      background: radial-gradient(circle at 50% 50%, #262b27 0%, #161a17 100%);\n      border: 2px solid #8c8981;\n      box-shadow: inset 0 5px 14px rgba(0,0,0,0.8);\n      position: relative;\n    }\n    .arcade-cross-h, .arcade-cross-v {\n      position: absolute;\n      background: rgba(255,255,255,0.10);\n      pointer-events: none;\n    }\n    .arcade-cross-h { width: 100%; height: 1px; top: 50%; left: 0; }\n    .arcade-cross-v { height: 100%; width: 1px; left: 50%; top: 0; }\n\n    .arcade-knob {\n      width: 56px;\n      height: 56px;\n      border-radius: 50%;\n      background: radial-gradient(circle at 35% 30%, #ff7836 0%, #e04400 72%);\n      border: 2.5px solid #ffe0cf;\n      box-shadow: 0 6px 14px rgba(0,0,0,0.5), inset 0 2px 3px rgba(255,255,255,0.45);\n      position: absolute;\n      left: 36px;\n      top: 36px;\n      pointer-events: none;\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      font-family: var(--font-mono);\n      font-weight: 700;\n      font-size: 11px;\n      color: #ffffff;\n    }\n\n    /* Quick Maneuver Mini Keycaps above Edge Controls */\n    .quick-pill-btn {\n      appearance: none;\n      border: 1px solid rgba(255,255,255,0.22);\n      background: rgba(22, 27, 23, 0.85);\n      color: #f1f5f9;\n      font-family: var(--font-ui);\n      font-size: 11px;\n      font-weight: 600;\n      padding: 5px 10px;\n      border-radius: 999px;\n      cursor: pointer;\n      backdrop-filter: blur(6px);\n      white-space: nowrap;\n      box-shadow: 0 4px 10px rgba(0,0,0,0.3);\n    }\n    .quick-pill-btn:active {\n      background: var(--accent-orange);\n      border-color: #ff8c52;\n    }\n\n    /* ============================================================\n     * SLIDE-OVER SUB-PAGE DRAWER (\u6230\u8853\u6f14\u793a & \u5c0d\u624b/\u8cfd\u5236\u8a2d\u5b9a)\n     * Keeps main 3D arena 100% clean & zero overlap!\n     * ============================================================ */\n    .drawer-backdrop {\n      position: fixed;\n      inset: 0;\n      background: rgba(12, 14, 12, 0.52);\n      backdrop-filter: blur(3px);\n      z-index: 40;\n      opacity: 0;\n      pointer-events: none;\n      transition: opacity 180ms ease;\n    }\n    .drawer-backdrop.open {\n      opacity: 1;\n      pointer-events: auto;\n    }\n\n    .subpage-drawer {\n      position: fixed;\n      top: 0;\n      right: 0;\n      width: min(440px, 94vw);\n      height: 100vh;\n      height: 100dvh;\n      background: var(--chassis-fill);\n      border-left: 2px solid var(--chassis-border);\n      box-shadow: -18px 0 42px rgba(0,0,0,0.45);\n      z-index: 50;\n      transform: translateX(100%);\n      transition: transform 200ms cubic-bezier(0.22, 1, 0.36, 1);\n      display: flex;\n      flex-direction: column;\n      overflow: hidden;\n    }\n    .subpage-drawer.open {\n      transform: translateX(0);\n    }\n\n    .drawer-header {\n      padding: 12px 14px;\n      border-bottom: var(--hairline);\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      gap: 8px;\n      background: rgba(255,255,255,0.28);\n    }\n    .drawer-title {\n      font-weight: 700;\n      font-size: 14.5px;\n      display: flex;\n      align-items: center;\n      gap: 8px;\n    }\n\n    .drawer-tabs {\n      display: grid;\n      grid-template-columns: 1fr 1fr;\n      gap: 6px;\n      padding: 10px 14px 8px;\n      border-bottom: var(--hairline);\n    }\n\n    .drawer-body {\n      flex: 1;\n      overflow-y: auto;\n      padding: 12px 14px 20px;\n      display: flex;\n      flex-direction: column;\n      gap: 12px;\n      touch-action: pan-y;\n    }\n    .drawer-body::-webkit-scrollbar { width: 6px; }\n    .drawer-body::-webkit-scrollbar-thumb { background: #b4b1a9; border-radius: 3px; }\n\n    .tab-pane { display: none; flex-direction: column; gap: 12px; }\n    .tab-pane.active { display: flex; }\n\n    .section-block {\n      display: flex;\n      flex-direction: column;\n      gap: 8px;\n      padding-bottom: 12px;\n      border-bottom: var(--hairline);\n    }\n    .section-block:last-child { border-bottom: none; padding-bottom: 0; }\n\n    .silk-header {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      font-family: var(--font-mono);\n      font-size: 10px;\n      font-weight: 700;\n      color: var(--ink-silk);\n      letter-spacing: 0.08em;\n      text-transform: uppercase;\n    }\n\n    .btn-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }\n    .btn-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }\n\n    /* Opponent Archetype Cards */\n    .arch-card {\n      background: rgba(255, 255, 255, 0.5);\n      border: 1px solid rgba(0, 0, 0, 0.14);\n      border-radius: 8px;\n      padding: 9px 10px;\n      cursor: pointer;\n      transition: all 120ms ease;\n      display: flex;\n      flex-direction: column;\n      gap: 4px;\n    }\n    .arch-card.selected {\n      background: #232421;\n      color: #f5f4f0;\n      border-color: #111;\n      box-shadow: 0 3px 0 #8f8c84;\n    }\n    .arch-top {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      font-weight: 700;\n      font-size: 12.5px;\n    }\n    .arch-pill {\n      font-family: var(--font-mono);\n      font-size: 9.5px;\n      padding: 2px 6px;\n      border-radius: 4px;\n      font-weight: 700;\n    }\n    .arch-pill.fast { background: #fee2e2; color: #b91c1c; }\n    .arch-pill.slow { background: #dbeafe; color: #1d4ed8; }\n    .arch-pill.bal  { background: #dcfce7; color: #15803d; }\n    .arch-card.selected .arch-pill.fast { background: #dc2626; color: #fff; }\n    .arch-card.selected .arch-pill.slow { background: #2563eb; color: #fff; }\n    .arch-card.selected .arch-pill.bal  { background: #16a34a; color: #fff; }\n    .arch-desc { font-size: 11px; color: var(--ink-secondary); line-height: 1.38; }\n    .arch-card.selected .arch-desc { color: #c7c6c0; }\n\n    /* Tactic Item Button */\n    .tac-btn {\n      width: 100%;\n      text-align: left;\n      justify-content: flex-start;\n      padding: 8px 10px;\n      font-size: 12px;\n    }\n    .tac-btn.selected {\n      background: var(--key-dark-bg);\n      color: #ffffff;\n      box-shadow: var(--key-dark-shadow);\n    }\n\n    /* Recessed OLED Box */\n    .oled-box {\n      background: var(--screen-bg);\n      border: 1.5px solid var(--screen-border);\n      border-radius: 8px;\n      box-shadow: var(--screen-shadow);\n      padding: 10px 12px;\n      color: var(--screen-ink);\n      font-family: var(--font-mono);\n      font-size: 11px;\n      line-height: 1.5;\n    }\n    .oled-title {\n      color: var(--accent-orange);\n      font-weight: 700;\n      font-size: 11.5px;\n      margin-bottom: 6px;\n      display: flex;\n      justify-content: space-between;\n    }\n    .oled-steps {\n      list-style: none;\n      display: flex;\n      flex-direction: column;\n      gap: 5px;\n      font-family: 'Noto Sans TC', sans-serif;\n      font-size: 12px;\n      color: #d9eadc;\n    }\n    .oled-steps li {\n      padding-left: 14px;\n      position: relative;\n    }\n    .oled-steps li::before {\n      content: '\u25b8';\n      position: absolute;\n      left: 0;\n      color: var(--accent-orange);\n    }\n    .oled-steps li.active-step {\n      color: #ffffff;\n      font-weight: 700;\n      background: rgba(255, 79, 0, 0.2);\n      border-radius: 4px;\n      padding: 3px 6px 3px 16px;\n    }\n\n    /* Sliders & Spec Grid */\n    .slider-row { display: flex; flex-direction: column; gap: 4px; }\n    .slider-label {\n      display: flex;\n      justify-content: space-between;\n      font-family: var(--font-mono);\n      font-size: 10.5px;\n      color: var(--ink-secondary);\n      font-variant-numeric: tabular-nums;\n    }\n    input[type=\"range\"] {\n      -webkit-appearance: none;\n      width: 100%;\n      height: 6px;\n      border-radius: 3px;\n      background: #b5b2aa;\n      box-shadow: inset 0 1px 2px rgba(0,0,0,0.35);\n      outline: none;\n    }\n    input[type=\"range\"]::-webkit-slider-thumb {\n      -webkit-appearance: none;\n      width: 18px;\n      height: 18px;\n      border-radius: 4px;\n      background: #2f2f2c;\n      border: 1.5px solid #f7f6f2;\n      cursor: pointer;\n    }\n\n    .spec-strip {\n      display: grid;\n      grid-template-columns: repeat(3, 1fr);\n      gap: 6px;\n      background: rgba(0,0,0,0.06);\n      border-radius: 7px;\n      padding: 8px;\n      font-family: var(--font-mono);\n      font-size: 10px;\n      text-align: center;\n    }\n    .spec-strip strong { display: block; font-size: 12px; color: var(--ink-primary); }\n    .spec-strip span { color: var(--ink-silk); font-size: 9.5px; }\n\n    .tele-grid {\n      display: grid;\n      grid-template-columns: 1fr 1fr;\n      gap: 6px;\n      font-family: var(--font-mono);\n      font-variant-numeric: tabular-nums;\n    }\n    .tele-cell {\n      background: #141916;\n      border: 1px solid #303a33;\n      border-radius: 6px;\n      padding: 7px 9px;\n      display: flex;\n      flex-direction: column;\n      gap: 2px;\n    }\n    .tele-k { font-size: 9.5px; color: var(--screen-muted); }\n    .tele-v { font-size: 13px; font-weight: 700; color: var(--screen-ink); }\n\n    @media (max-width: 760px) {\n      .round-badge { display: none; }\n      .brand-badge span.hide-xs { display: none; }\n      .bottom-status-bar { max-width: calc(100vw - 210px); font-size: 11px; }\n      .tank-track { height: 136px; }\n      .tank-knob { top: 42px; }\n    }\n  </style>\n</head>\n<body>\n  <div class=\"app-root\">\n    <!-- SLIM TOP HARDWARE BAR -->\n    <header class=\"top-bar\">\n      <div class=\"bar-left\">\n        <div class=\"brand-badge\"><span class=\"led-dot\"></span>SRC 2027 <span class=\"hide-xs\">\u76f8\u64b2</span></div>\n        <button class=\"keycap orange sm\" id=\"btn-start\">\u25b6 3-2-1 \u958b\u8cfd</button>\n        <button class=\"keycap sm\" id=\"btn-reset-round\">\u21ba \u91cd\u7f6e</button>\n      </div>\n\n      <div class=\"oled-scoreboard\" aria-label=\"\u6bd4\u8cfd\u8a08\u5206\u677f\">\n        <div class=\"score-pair\">\n          <span class=\"score-tag\">\u6211\u65b9</span>\n          <span class=\"score-num me\" id=\"score-me\">0</span>\n          <span style=\"color:#64748b\">:</span>\n          <span class=\"score-num opp\" id=\"score-opp\">0</span>\n          <span class=\"score-tag\" id=\"score-opp-name\">\u7375\u8c79\u5feb\u8eca</span>\n        </div>\n        <div class=\"timer-readout\" id=\"timer-display\">60.0</div>\n        <div class=\"round-badge\" id=\"round-display\">\u7b2c1\u5c40 \u00b7 \u9762\u5411\u5de6</div>\n      </div>\n\n      <div class=\"bar-right\">\n        <button class=\"keycap sm active-mode\" id=\"btn-ctrl-toggle\" title=\"\u5207\u63db\u96d9\u9375\u624b\u63a3\u6216\u5de6\u5074\u55ae\u6416\u687f\">\u96d9\u9375 1/2</button>\n        <button class=\"keycap dark sm\" id=\"btn-open-drawer\">\u2630 \u6230\u8853\u8207\u8a2d\u5b9a</button>\n        <button class=\"keycap sm\" id=\"btn-mute\" title=\"\u958b\u95dc\u97f3\u6548\">\ud83d\udd0a</button>\n      </div>\n    </header>\n\n    <!-- UNOBSTRUCTED FULL-SCREEN 3D STAGE -->\n    <main class=\"stage-wrap\">\n      <div id=\"canvas-host\"></div>\n\n      <!-- Top-Left Camera & Vector Pills -->\n      <div class=\"corner-tl\">\n        <button class=\"hud-btn active\" id=\"cam-broadcast\">\u8cfd\u5834</button>\n        <button class=\"hud-btn\" id=\"cam-top\">\u4fef\u8996</button>\n        <button class=\"hud-btn\" id=\"cam-chase\">\u8ffd\u5c3e</button>\n        <button class=\"hud-btn active\" id=\"btn-toggle-vectors\">\u7bad\u982d ON</button>\n      </div>\n\n      <!-- Top-Right Zone & Speed Pills -->\n      <div class=\"corner-tr\">\n        <div class=\"hud-pill\">\n          <span class=\"led-dot green\" id=\"led-zone\"></span>\n          <span id=\"hud-zone-text\">\u5b89\u5168\u5340 \u00b7 R=16cm</span>\n        </div>\n        <button class=\"hud-btn\" id=\"spd-05\">0.5x</button>\n        <button class=\"hud-btn active\" id=\"spd-10\">1x</button>\n        <button class=\"hud-btn\" id=\"spd-15\">1.5x</button>\n      </div>\n\n      <!-- Center Countdown / Result Banner -->\n      <div class=\"center-banner\" id=\"center-banner\">\n        <div class=\"banner-main\" id=\"banner-main\">3</div>\n        <div class=\"banner-sub\" id=\"banner-sub\">\u96d9\u65b9\u8cbc\u9f4a\u4e2d\u5fc3\u9ed1\u7dda\u5f8c\u65b9\uff0c\u6e96\u5099\u958b\u8cfd\uff01</div>\n      </div>\n\n      <!-- Compact Bottom-Center Status & Quick Demo Bar -->\n      <div class=\"bottom-status-bar\" id=\"bottom-status-bar\">\n        <span class=\"led-dot\" id=\"led-status\"></span>\n        <span class=\"status-text\" id=\"toast-text\">\u96d9\u65b9\u5df2\u8cbc\u9f4a\u9ed1\u7dda\u5f8c\u65b9\uff01\u6309\u300c\u25b6 3-2-1 \u958b\u8cfd\u300d\u76f4\u63a5\u64cd\u63a7\uff0c\u6216\u9ede\u53f3\u4e0a\u300c\u2630 \u6230\u8853\u8207\u8a2d\u5b9a\u300d\u770b\u5feb/\u6162\u8eca\u793a\u7bc4\u3002</span>\n        <button class=\"hud-btn\" id=\"btn-quick-replay\" style=\"display:none;flex-shrink:0;\">\u21ba \u91cd\u64ad</button>\n      </div>\n\n      <!-- ============================================================\n           IPAD EDGE CONTROLLER \u2014 LEFT EDGE\n           Tank Mode: Left Motor (1\u9375) | Arcade Mode: 360\u00b0 Single Joystick\n           ============================================================ -->\n      <div class=\"edge-ctrl left\" id=\"edge-left-tank\">\n        <button class=\"quick-pill-btn\" id=\"btn-move-back-l\">\u2199 \u55ae\u8f2a\u659c\u9000 (Q)</button>\n        <div class=\"tank-pad\">\n          <div class=\"tank-track\" id=\"stick-left-track\">\n            <div class=\"tank-knob\" id=\"stick-left-knob\">1</div>\n          </div>\n          <div class=\"ctrl-caption\">\u5de6\u9375 W/S</div>\n        </div>\n      </div>\n\n      <div class=\"edge-ctrl left hidden\" id=\"edge-left-arcade\">\n        <button class=\"quick-pill-btn\" id=\"btn-move-feint-arcade\">\u26a1 \u8f15\u9000\u7834\u50f5\u5c40 (Space)</button>\n        <div class=\"arcade-pad\" id=\"arcade-pad\">\n          <div class=\"arcade-well\" id=\"arcade-well\">\n            <div class=\"arcade-cross-h\"></div>\n            <div class=\"arcade-cross-v\"></div>\n            <div class=\"arcade-knob\" id=\"arcade-knob\">MOVE</div>\n          </div>\n        </div>\n      </div>\n\n      <!-- ============================================================\n           IPAD EDGE CONTROLLER \u2014 RIGHT EDGE\n           Tank Mode: Right Motor (2\u9375) | Arcade Mode: COMPLETELY EMPTY!\n           ============================================================ -->\n      <div class=\"edge-ctrl right\" id=\"edge-right-tank\">\n        <button class=\"quick-pill-btn\" id=\"btn-move-back-r\">\u2198 \u55ae\u8f2a\u659c\u9000 (E)</button>\n        <div class=\"tank-pad\">\n          <div class=\"tank-track\" id=\"stick-right-track\">\n            <div class=\"tank-knob right-stick\" id=\"stick-right-knob\">2</div>\n          </div>\n          <div class=\"ctrl-caption\">\u53f3\u9375 \u2191/\u2193</div>\n        </div>\n      </div>\n    </main>\n  </div>\n\n  <!-- SLIDE-OVER SUB-PAGE DRAWER (\u6230\u8853\u793a\u7bc4 & \u5c0d\u624b\u8a2d\u5b9a\u526f\u9801) -->\n  <div class=\"drawer-backdrop\" id=\"drawer-backdrop\"></div>\n  <aside class=\"subpage-drawer\" id=\"subpage-drawer\" aria-label=\"\u6230\u8853\u6f14\u7df4\u8207\u8a2d\u5b9a\u526f\u9801\">\n    <div class=\"drawer-header\">\n      <div class=\"drawer-title\"><span class=\"led-dot\"></span>\u6230\u8853\u6f14\u7df4\u8207\u8cfd\u5834\u8a2d\u5b9a</div>\n      <button class=\"keycap sm\" id=\"btn-close-drawer\">\u2715 \u95dc\u9589\u8fd4\u56de\u5834\u5730</button>\n    </div>\n\n    <div class=\"drawer-tabs\">\n      <button class=\"keycap sm active-mode\" id=\"tab-btn-tactics\">\u26a1 \u5feb/\u6162\u8eca\u61c9\u5c0d\u6f14\u793a</button>\n      <button class=\"keycap sm\" id=\"tab-btn-setup\">\u2699\ufe0f \u5c0d\u624b\u3001\u958b\u5c40\u8207\u9059\u6e2c</button>\n    </div>\n\n    <div class=\"drawer-body\">\n      <!-- SUB-PAGE TAB 1: TACTICAL COUNTER-PLAYBOOK -->\n      <div class=\"tab-pane active\" id=\"tab-pane-tactics\">\n        <div class=\"section-block\">\n          <div class=\"silk-header\">\n            <span>COUNTER LAB // \u9078\u64c7\u5be6\u6230\u61c9\u5c0d\u62db\u5f0f</span>\n            <span style=\"color:var(--accent-orange)\">\u8ab2\u4ef6\u7b56\u7565 1\u20136</span>\n          </div>\n          <div style=\"display:flex;flex-direction:column;gap:6px;\">\n            <button class=\"keycap sm tac-btn selected\" id=\"tac-fast-lr\">\u2460 \u6253\u5feb\u8eca\u3010\u5de6/\u53f3\u958b\u5c40\u3011\uff1a\u55ae\u8f2a\u659c\u9000\u62c9\u5f27\u7dda\u53cd\u93df</button>\n            <button class=\"keycap sm tac-btn\" id=\"tac-fast-back\">\u2461 \u6253\u5feb\u8eca\u3010\u5411\u5f8c\u958b\u5c40\u3011\uff1a\u524d\u9032\u534a\u6b65\u2192\u9ec3\u5708\u908a\u6389\u982d</button>\n            <button class=\"keycap sm tac-btn\" id=\"tac-slow-45\">\u2462 \u6253\u6162\u8eca\u3010\u6436 45\u00b0 \u5074\u5207\u3011\uff1a\u958b\u5c40\u7e5e\u5f27\u63d2\u8f2a\u80ce\u5074\u9762</button>\n            <button class=\"keycap sm tac-btn\" id=\"tac-slow-feint\">\u2463 \u6253\u6162\u8eca\u3010\u9802\u6b7b\u7834\u50f5\u5c40\u3011\uff1a\u6ed1\u6b65\u8f15\u9000\u9a19\u524d\u64b2\u53cd\u5207</button>\n            <button class=\"keycap sm tac-btn\" id=\"tac-edge-save\">\u2464 \u908a\u7de3\u81ea\u6551\u3010\u7d05\u7d2b\u9ed1\u908a\u3011\uff1a\u55ae\u8f2a\u7529\u5c3e\u9583\u958b\u53cd\u6bba</button>\n            <button class=\"keycap sm tac-btn\" id=\"tac-cup-drill\">\u2465 \u6e96\u78ba\u5ea6\u8a13\u7df4\uff1a\u4e2d\u5fc3\u7d19\u676f\u5854\u63a8\u64ca\u7df4\u7fd2 (Level 1)</button>\n          </div>\n\n          <div class=\"btn-grid-2\" style=\"margin-top:4px;\">\n            <button class=\"keycap orange\" id=\"btn-auto-demo\">\u25b6 \u81ea\u52d5\u793a\u7bc4\u9019\u62db</button>\n            <button class=\"keycap dark\" id=\"btn-manual-drill\">\ud83c\udfae \u6211\u4f86\u624b\u52d5\u7df4</button>\n          </div>\n        </div>\n\n        <div class=\"section-block\">\n          <div class=\"silk-header\">\n            <span>TACTICAL PLAYBOOK // \u6b65\u9a5f\u8a73\u89e3</span>\n            <span id=\"strat-status\" style=\"color:var(--accent-orange)\">READY</span>\n          </div>\n          <div class=\"oled-box\">\n            <div class=\"oled-title\">\n              <span id=\"strat-name\">\u7b56\u7565 2\uff1a\u958b\u5c40\u3010\u9762\u5411\u5de6\uff0f\u53f3\u3011\u6253\u5feb\u8eca</span>\n            </div>\n            <ul class=\"oled-steps\" id=\"strat-steps\">\n              <li class=\"active-step\">\u2460 \u5feb\u8eca\u6703\u6025\u8f49\u885d\u904e\u4f86\uff01\u5343\u842c\u5225\u539f\u5730\u6162\u8f49\uff08\u8f49\u4e00\u534a\u5c31\u88ab\u649e\u5074\u9762\uff09</li>\n              <li>\u2461 \u55ae\u8f2a\u659c\u9000\u62c9\u5f27\u7dda\uff1a\u53ea\u62c9\u5f8c\u53f3\u9375\uff0c\u9000\u534a\u6b65\uff08\u52ff\u9000\u9032\u7d05\u7d2b\u5340\uff09</li>\n              <li>\u2462 \u7b49\u5feb\u8eca\u64b2\u7a7a\u715e\u4e0d\u4f4f\uff0c\u7acb\u523b\u96d9\u9375\u524d\u63a8\u7528 11 \u7247\u6a59\u93df\u53cd\u93df\u5074\u9762\uff01</li>\n            </ul>\n          </div>\n        </div>\n\n        <div class=\"section-block\">\n          <div class=\"silk-header\">\n            <span>MY ROBOT // \u76f8\u64
