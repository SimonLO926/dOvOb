<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Crazy Lust · 色慾試玩 1.2.40</title>
  <style>
    @font-face{font-family:"Pixel Hant";src:url('./fonts/fusion-pixel-zh-hant.woff2') format('woff2');font-display:swap}
    @font-face{font-family:"Pixel Latin";src:url('./fonts/fusion-pixel-latin.woff2') format('woff2');font-display:swap}
    @font-face{font-family:"Fever Brush";src:url('./fonts/fever-brush.woff') format('woff');font-display:swap}
    *{box-sizing:border-box} [hidden]{display:none!important}
    html,body{margin:0;height:100%;overflow:hidden;background:#211022;color:#ffe0ec;font-family:"Pixel Hant",sans-serif;overscroll-behavior:none}
    body{background:linear-gradient(#06221935,#06171375),url('./assets/lust-clouds-r2.webp') center/cover fixed}
    button,select,input{font:inherit}button{min-width:44px;min-height:44px;cursor:pointer;color:#ffe0eb;background:var(--task-field,#204452);border:1px solid var(--task-accent,#a8cdd8);border-radius:12px;padding:9px 14px;touch-action:manipulation}
    button:hover,button:focus-visible{outline:2px solid #e5efb8;outline-offset:2px;background:#70405e}button:disabled{opacity:.38;cursor:default}
    .nav{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;position:relative;z-index:5;background:#05161088;font-size:13px}.nav small{color:#aac19a;margin-left:12px;font-size:10px}
    #menu-button{width:44px;padding:0;font-size:24px}
    .stage{display:flex;align-items:center;justify-content:center;height:calc(100svh - 298px);position:relative}
    #board-wrap{position:relative;flex:none;isolation:isolate}.canvas-board{position:absolute;inset:0;width:100%;height:100%;z-index:2;touch-action:none;image-rendering:pixelated}
    #boss-frame{position:absolute;left:-50%;top:0;width:200%;height:100%;pointer-events:none;z-index:1;image-rendering:pixelated}
    #board-wrap.danger:after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 16px #eb635a;outline:2px solid #e66a63;pointer-events:none;z-index:3}
    #board-wrap.shake{animation:shake .2s infinite}@keyframes shake{0%,100%{translate:0 0}25%{translate:2px -1px}75%{translate:-2px 1px}}
    .desktop .stage{height:calc(100svh - 120px)}
    .pads{height:254px;display:flex;justify-content:space-between;gap:10px;padding:92px 12px max(12px,env(safe-area-inset-bottom));max-width:610px;margin:auto;position:relative;z-index:4;touch-action:none}
    .move-pads{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:150px;height:150px;position:relative;flex:none}.move-pads button{flex:1;font-size:36px;background:var(--task-base,#183140)}
    .action-pads{display:grid;width:150px;height:150px;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:6px}
    #up{grid-column:2;grid-row:1}#alt{grid-column:1;grid-row:2}#action{grid-column:3;grid-row:2;background:var(--task-accent,#e4c584);color:#182633;border-color:#e1e9a7}#down{grid-column:2;grid-row:3}.action-pads button{padding:4px;font-size:11px;min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:18px}.action-pads svg{width:22px;height:22px}.move-pads svg{width:36px;height:36px}.move-pads button{min-width:0;padding:4px;border-radius:18px}#rotate-left{position:absolute;left:0;bottom:calc(100% + 6px);width:58px;height:44px;min-width:0;min-height:44px;padding:3px;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}#rotate-left svg{width:20px;height:20px}
    .veil{position:fixed;inset:0;z-index:20;padding:16px;display:flex;overflow:auto;touch-action:pan-y;background:#02100be0;backdrop-filter:blur(5px)}
    .card{width:min(440px,100%);margin:auto;padding:24px;background:linear-gradient(145deg,#254454f5,#152337f5);border:1px solid var(--task-accent,#a8cdd8);border-radius:20px;box-shadow:0 12px 70px #0008;max-height:calc(100svh - 32px);overflow:auto;touch-action:pan-y}
    .card h1{font-size:28px;color:#e9efb5;margin:12px 0}.card h2{font-size:21px;margin:10px 0 18px}.card p{font-size:13px;color:#bccfaf;line-height:1.65;margin:8px 0 14px}.card small{font-size:11px;color:#e3a2c4;letter-spacing:2px}
    .card label{display:block;font-size:14px;margin:16px 0}.card select{display:block;width:100%;margin-top:8px;padding:12px;background:#0d251b;color:#eef1d3;border:1px solid var(--task-accent,#a8cdd8);border-radius:8px;min-height:44px}
    .card .check{display:flex;align-items:center;gap:12px}.card .check input{width:22px;height:22px;accent-color:#b3d17d;flex:none}.card .buttons{display:grid;gap:10px;margin-top:16px}
    #start{width:100%;background:#e7c78b;color:#182633}.card .muted{font-size:11px;color:#94b491}.return-row{position:sticky;bottom:-24px;background:#4b2843f5;padding:12px 0 0;margin-top:18px}
    #scene-actions{position:absolute;left:0;right:0;bottom:12px;z-index:7;display:flex;gap:7px;justify-content:center;flex-wrap:wrap}#scene-actions button{font-size:12px;background:#4d2545f5;padding:8px 12px}
    #lust-cat{position:fixed;z-index:6;pointer-events:none;margin:0;line-height:0;filter:drop-shadow(0 3px 5px #0009)}
    #lust-cat img{display:block;opacity:0;width:100%;height:auto;image-rendering:auto}
    #cat-photo-motion{position:absolute;left:0;top:-12px;width:100%;height:calc(100% + 20px);display:block}#cat-fish{position:absolute;right:4px;top:4px;width:36px;height:18px;display:none;filter:drop-shadow(0 0 5px #ffedb4)}
    #lust-cat.gift canvas{filter:drop-shadow(0 0 9px #ffdc83)}#lust-cat.gift #cat-fish{display:block}
    #ending-screen{position:fixed;inset:0;z-index:10;overflow:hidden;background:#211022;isolation:isolate}
    #ending-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;image-rendering:pixelated}
    #ending-title{position:absolute;inset:0 0 auto;margin:0;padding:max(22px,env(safe-area-inset-top)) 16px 42px;text-align:center;font-size:clamp(22px,4vw,36px);color:#fff0c8;text-shadow:0 2px 5px #000;background:linear-gradient(#211023e8,#21102300);line-height:1.5}
    #ending-footer{position:absolute;inset:auto 0 0;padding:24px max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom));text-align:center;background:linear-gradient(#21102300,#211023ee 30%);max-height:48%;overflow:auto;touch-action:pan-y;z-index:2}
    #ending-caption{font-size:16px;line-height:1.6;margin:0 auto 12px;color:#f0edce;text-shadow:0 1px 3px #000}
    #ending-footer #scene-actions{position:static;gap:10px;max-width:620px;margin:auto}
    #ending-footer #scene-actions button{font-size:16px;min-height:48px;min-width:88px;padding:10px 16px;background:#4e2746ee}
    body.ending-page .stage,body.ending-page .pads,body.ending-page .nav{visibility:hidden}
    body.ending-page #lust-cat{z-index:11}
    .wide .nav{position:absolute;inset:0 0 auto;height:44px;background:none;pointer-events:none}.wide .nav button{pointer-events:auto}.wide .nav small{display:none}
    .wide .stage{height:100svh}.wide .pads{height:0;padding:0;position:static}.wide .move-pads{position:fixed;left:12px;bottom:12px;width:150px;height:150px;z-index:5}.wide .action-pads{position:fixed;right:12px;bottom:12px;z-index:5;grid-template-columns:repeat(3,1fr)}
    .wide #scene-actions{bottom:4px}.wide #scene-actions button{padding:4px 7px;min-height:44px;font-size:10px}
    @media(max-width:350px){.move-pads{width:calc(100vw - 178px)}.action-pads{width:144px}}
    @media(prefers-reduced-motion:reduce){#board-wrap.shake{animation:none}}

    /* The dating game alone uses a classic 4:3 visual novel stage. */
    #vn-page{position:fixed;inset:44px 0 90px;z-index:7;display:flex;align-items:center;justify-content:center;background:#0e1822d9}
    #vn-shell{position:relative;overflow:hidden;background:#101930;border:3px double #e3dbbd;box-shadow:0 0 0 2px #283c59;isolation:isolate;color:#eee8c4;font-size:var(--vn-font,18px);image-rendering:pixelated}
    #vn-background{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
    #vn-character{position:absolute;right:7%;top:6%;height:74%;width:45%;object-fit:contain;object-position:50% 0;image-rendering:pixelated;pointer-events:none;filter:drop-shadow(3px 0 #111a)}
    #vn-character.narration{opacity:.8}
    #vn-hud{position:absolute;inset:0 0 auto;min-height:25px;padding:5px 9px;display:flex;gap:10px;align-items:center;font-size:.72em;background:#17203de8;border-bottom:1px solid #d1d4bb}
    #vn-boss-bar{width:75px;height:4px;background:#354166;margin-left:auto}#vn-boss-fill{height:100%;background:#db91af}
    #vn-tools{position:absolute;right:9px;top:36px;display:flex;gap:5px}#vn-tools button{min-height:32px;padding:4px 8px;font-size:.7em}
    #vn-dialogue{position:absolute;left:2%;right:2%;bottom:7%;height:38%;padding:8px 12px;background:#111a35f2;border:3px double #e3dbbd;display:flex;flex-direction:column;gap:5px;cursor:pointer}
    #vn-speaker{font-size:.95em;color:#eac892;line-height:1.1}#vn-dialogue-text{margin:0;line-height:1.45;font-size:1em;flex:1;overflow:auto;touch-action:pan-y;white-space:pre-wrap;text-align:left}
    #vn-choices{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;flex:none}#vn-choices button{min-height:44px;min-width:0;padding:5px;font-size:.82em;line-height:1.3;white-space:normal}
    #vn-next{align-self:flex-end;min-height:35px;padding:5px 12px;font-size:.78em}
    #vn-shell button{border-radius:0;background:#253551;color:#f1ebc9;border:2px solid #a3b6b8;box-shadow:inset -2px -2px #101b32,inset 2px 2px #718397}
    #vn-shell button.selected,#vn-shell button:hover{background:#496576;border-color:#f0d796}
    #vn-footer{position:absolute;left:2%;right:2%;bottom:1.2%;display:flex;gap:8px;align-items:center;font-size:.65em;background:#14203fe8;padding:4px 7px;min-height:20px}
    #vn-hp-bar,#vn-bond-bar{width:12%;height:4px;background:#3a4259}#vn-hp-fill{height:100%;background:#ed9cbc}#vn-bond-fill{height:100%;background:#d1c58d}
    #vn-status{margin-left:auto;color:#e1d7ae;max-width:45%;text-align:right}
    #vn-history{position:absolute;inset:8% 5% 8%;background:#15203ff5;border:3px double #e1d7ae;padding:15px;overflow:auto;touch-action:pan-y;z-index:4}#vn-history p{line-height:1.6;font-size:.8em}#vn-log-close{position:sticky;bottom:0}
    #vn-rotate{position:fixed;bottom:9px;left:4px;right:4px;text-align:center;color:#d5d6be;font-size:12px;pointer-events:none}
    body.dating-page .stage,body.dating-page .pads{visibility:hidden}body.dating-page .nav{z-index:9;visibility:visible}body.dating-page #lust-cat{z-index:9}
    @media(max-width:600px){#vn-dialogue{height:48%;bottom:8%;padding:6px 8px;gap:3px}#vn-dialogue-text{line-height:1.35}#vn-next{min-height:32px}#vn-tools{top:31px}#vn-character{height:67%;top:7%}#vn-hud{font-size:10px;padding:4px 6px;gap:6px}#vn-boss-bar{width:42px}#vn-progress{white-space:nowrap}#vn-status{font-size:9px}#vn-footer{font-size:10px;padding:3px 5px}#vn-choices{gap:3px}#vn-choices button{font-size:11px;padding:3px} }
    @media(orientation:landscape) and (max-height:620px){#vn-page{inset:0}#vn-rotate{display:none}#vn-tools{top:34px}#vn-dialogue{height:42%}}
    #vn-shell.danger{outline:2px solid #ef6c71}#vn-shell.shake{animation:shake .2s infinite}
    #vn-shell:fullscreen{margin:auto;border:3px double #e3dbbd}
  </style>
</head>
<body data-theme="dark">
  <header class="nav"><div>BRIDGE <small>CRAZY · LUST · 1.2.40</small></div><button id="menu-button" aria-label="開啟試玩選單" type="button">☰</button></header>
  <main class="stage"><div id="board-wrap"><canvas id="boss-frame" width="560" height="720" aria-hidden="true"></canvas><canvas id="lust-board" class="canvas-board" width="280" height="720" aria-label="色慾遊戲框"></canvas><div id="scene-actions" hidden><button id="scene-continue" type="button">繼續</button><button id="scene-retry" type="button" hidden>重試</button><button id="scene-pick" type="button" hidden>換關</button></div></div></main>
  <div class="pads" aria-label="遊戲操作" hidden>
    <div class="move-pads"><button id="rotate-left" type="button" aria-label="反向旋轉"><svg viewBox="0 0 24 24" aria-hidden="true" style="transform: scaleX(-1)"><path d="M19.4 12a7.4 7.4 0 1 1-2.1-5.2M19.4 4.2V8.8H14.8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>左旋</span></button><button id="left" type="button" aria-label="向左"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 L7 12 L14.5 18.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button id="right" type="button" aria-label="向右"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 5.5 L17 12 L9.5 18.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
    <div class="action-pads"><button id="up" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 12a7.4 7.4 0 1 1-2.1-5.2M19.4 4.2V8.8H14.8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="pad-label">右旋</span></button><button id="alt" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4.2" y="4.2" width="15.6" height="15.6" rx="3" fill="none" stroke="currentColor" stroke-width="2.4"/><rect x="8.3" y="8.3" width="7.4" height="7.4" rx="1.4" fill="currentColor"/></svg><span class="pad-label">留</span></button><button id="action" type="button"><svg class="drop-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 V15 M7.5 11 L12 16.5 L16.5 11 M5 20.5 H19" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="pad-label">落</span></button><button id="down" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 9 L12 15 L17.5 9" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="pad-label">降</span></button></div>
  </div>
  <figure id="lust-cat" hidden aria-label="原有貓咪"><img src="./assets/mischief-cat.webp" alt="貓咪"><canvas id="cat-photo-motion" aria-hidden="true"></canvas><svg id="cat-fish" viewBox="0 0 36 18" aria-hidden="true"><path d="M11 9 23 2 34 9 23 16Z M11 9 2 2 2 16Z" fill="#edc579"/><rect x="29" y="7" width="2" height="2" fill="#fff7c9"/></svg></figure>
  <section id="ending-screen" hidden tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="ending-title" aria-describedby="ending-caption"><img id="ending-art" alt="" style="object-fit:cover"><h1 id="ending-title"></h1><div id="ending-footer"><p id="ending-caption"></p></div></section>

  <section id="vn-page" hidden aria-label="劇情育成"><div id="vn-shell">
    <img id="vn-background" alt=""/><img id="vn-character" alt=""/>
    <div id="vn-hud"><span id="vn-chapter"></span><span id="vn-progress"></span><span id="vn-timer"></span><div id="vn-boss-bar" aria-label="Boss"><div id="vn-boss-fill"></div></div></div>
    <div id="vn-tools"><button id="vn-log" type="button">紀錄</button><button id="vn-fullscreen" type="button">全螢幕</button></div>
    <div id="vn-dialogue"><strong id="vn-speaker"></strong><p id="vn-dialogue-text"></p><div id="vn-choices" hidden></div><button id="vn-next" type="button">繼續</button></div>
    <div id="vn-footer"><span id="vn-hp"></span><div id="vn-hp-bar"><div id="vn-hp-fill"></div></div><span id="vn-bond"></span><div id="vn-bond-bar"><div id="vn-bond-fill"></div></div><span id="vn-status"></span></div>
    <aside id="vn-history" hidden><div id="vn-history-lines"></div><button id="vn-log-close" type="button">返回對話</button></aside>
  </div><p id="vn-rotate"></p></section>
  <section id="launcher" class="veil"><form class="card" id="launch-form"><small>CRAZY · LUST · 1.2.40</small><h1 id="launcher-title">色慾試玩</h1><p id="launch-description"></p><label><span id="scenario-label"></span><select id="scenario"></select></label><label><span id="difficulty-label"></span><select id="difficulty"><option value="normal">Normal</option><option value="hard">Hard</option></select></label><button id="start" type="submit"></button><p class="muted" id="prototype-note"></p></form></section>
  <section id="menu" class="veil" hidden><div class="card"><h2 id="menu-title"></h2><p id="control-guide"></p><div class="buttons"><button id="resume" type="button"></button><button id="retry" type="button"></button><button id="pick" type="button"></button></div><label>Language<select id="lust-language"><option value="en">English</option><option value="zh-Hant">繁體中文</option></select></label><label><span id="touch-label"></span><select id="touch"><option value="auto">Auto</option><option value="on">On</option><option value="off">Off</option></select></label><label><span id="danger-label"></span><select id="danger"><option value="warning">Warning</option><option value="shake">Shake</option></select></label><label class="check"><input id="reduce" type="checkbox"><span id="reduce-label"></span></label><label><span id="music-label"></span><input id="music-volume" type="range" min="0" max="100" value="70" style="display:block;width:100%;min-height:44px"></label><label><span id="sound-label"></span><input id="sound-volume" type="range" min="0" max="100" value="70" style="display:block;width:100%;min-height:44px"></label><p class="muted" id="music-note"></p><div class="return-row"><button id="menu-return" type="button"></button></div></div></section>
  <script type="module" src="./lust/app.mjs?v=1.2.40"></script>
</body></html>
