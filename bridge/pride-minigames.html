<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>傲慢小遊戲試玩</title>
<link rel="stylesheet" href="./pride-demo.css">
<nav><select id="game" aria-label="選擇遊戲"><option value="pride-mirror-match">鏡像配對</option><option value="pride-crown-choice">加冕抉擇</option><option value="pride-lianliankan">連連看</option><optgroup label="第二條血 · 鏡之試煉"><option value="pride-shard-puzzle">碎鏡拼圖</option><option value="pride-truth-trial">真假鏡</option><option value="pride-mirror-maze">鏡面迷宮</option><option value="pride-doodle">爬塔（普通輪換）</option></optgroup><optgroup label="50% 血劇情專用"><option value="pride-tower">巴別塔 · 半血試煉</option></optgroup></select><select id="difficulty" aria-label="難度"><option value="normal">普通</option><option value="hard">困難</option></select><select id="boss" aria-label="首領血量"><option value="1">Boss 100% 血量</option><option value="0.6">Boss 60% 血量</option><option value="0.3">Boss 30% 血量</option></select><button id="restart">重新開始</button></nav>
<main class="demo"><header class="banner"><small>PRIDE · 傲慢試煉</small><h1 id="game-title"></h1><p id="control-hint"></p><p class="legend">♥ 心心係你 · 各遊戲有獨立過關目標</p></header><div class="stage"><canvas width="280" height="560" tabindex="0" aria-label="傲慢遊戲"></canvas><div class="tutorial" id="tutorial" role="dialog" aria-labelledby="tutorial-title"><div class="tutorial-card"><h2 id="tutorial-title"></h2><p id="instructions"></p><small>3 秒後自動開始</small><button id="skip">開始／跳過</button></div></div></div><div class="touch-controls" hidden aria-label="觸控控制"><div class="dpad"><button data-action="up" aria-label="上">↑</button><button data-action="left" aria-label="左">←</button><button data-action="down" aria-label="下">↓</button><button data-action="right" aria-label="右">→</button></div><div class="actions"><button data-action="action" aria-label="主動作">動作</button><button data-action="alt" aria-label="保留鍵位的副動作">保留</button></div></div></main>
<script type="module" src="./pride-minigames-demo.mjs"></script></html>
