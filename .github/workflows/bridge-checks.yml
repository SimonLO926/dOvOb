name: Bridge tests and Pages build
on:
  pull_request:
    branches: [master]
    paths:
      - 'bridge/**'
      - 'source-assets/lust/**'
      - 'source-assets/gluttony/**'
      - '_config.yml'
      - '.github/workflows/bridge-checks.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Boss and shared game regression tests
        run: node --test bridge/*.test.mjs bridge/minigames/*.test.mjs bridge/envy/*.test.mjs bridge/lust/*.test.mjs bridge/cartridge/*.test.mjs bridge/gluttony/*.test.mjs
      - name: Verify cartridge geometry, colors and pointer rays
        run: |
          npm install --prefix "$RUNNER_TEMP/cartridge-tools" --no-package-lock --ignore-scripts --no-audit --no-fund esbuild@0.27.0 three@0.180.0
          NODE_PATH="$RUNNER_TEMP/cartridge-tools/node_modules" "$RUNNER_TEMP/cartridge-tools/node_modules/.bin/esbuild" bridge/tools/cartridge-batch.test-source.mjs --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/cartridge-batch.test.mjs"
          node --test "$RUNNER_TEMP/cartridge-batch.test.mjs"
      - name: Verify Gluttony bundle matches maintained modules
        run: |
          npm install --prefix "$RUNNER_TEMP/gluttony-tools" --no-package-lock --ignore-scripts --no-audit --no-fund esbuild@0.27.0
          "$RUNNER_TEMP/gluttony-tools/node_modules/.bin/esbuild" bridge/gluttony/app.mjs --bundle --format=esm --minify --outfile="$RUNNER_TEMP/gluttony.bundle.js"
          cmp bridge/gluttony/preview.bundle.js "$RUNNER_TEMP/gluttony.bundle.js"
      - name: Build actual Pages output
        uses: actions/jekyll-build-pages@v1
      - name: Verify runtime pages and source exclusions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          site=Path('_site')
          assert (site/'bridge/gluttony-preview.html').is_file()
          assert (site/'bridge/gluttony.html').is_file()
          assert len(list((site/'bridge/assets/gluttony-music').glob('*.mp3'))) == 7
          assert (site/'bridge/gluttony/preview.bundle.js').is_file()
          assert not (site/'memory').exists()
          assert (site/'bridge/lust-preview.html').is_file()
          assert (site/'bridge/cartridge-preview.html').is_file()
          assert (site/'bridge/lust.html').is_file()
          assert (site/'bridge/cartridge.html').is_file()
          assert not (site/'source-assets').exists()
          assert not (site/'bridge/tools').exists()
          for p in site.rglob('*'):
              assert 'node_modules' not in p.parts, p
              assert not p.name.endswith('.test.mjs'), p
          PY
      - name: Attach Gluttony r3 validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: gluttony-r3-validation
          path: |
            source-assets/gluttony/verification-r3/
            source-assets/gluttony/verification-r4/
            source-assets/gluttony/music/manifest.json
