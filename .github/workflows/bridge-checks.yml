name: Bridge tests and Pages build
on:
  pull_request:
    branches: [master]
    paths:
      - 'bridge/**'
      - 'source-assets/lust/**'
      - '_config.yml'
      - '.github/workflows/bridge-checks.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Boss and shared game regression tests
        run: node --test bridge/*.test.mjs bridge/minigames/*.test.mjs bridge/envy/*.test.mjs bridge/lust/*.test.mjs bridge/cartridge/*.test.mjs
      - name: Build actual Pages output
        uses: actions/jekyll-build-pages@v1
      - name: Verify runtime pages and source exclusions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          site=Path('_site')
          assert (site/'bridge/lust-preview.html').is_file()
          assert (site/'bridge/cartridge-preview.html').is_file()
          assert (site/'bridge/lust.html').is_file()
          assert (site/'bridge/cartridge.html').is_file()
          assert not (site/'source-assets').exists()
          assert not (site/'bridge/tools').exists()
          for p in site.rglob('*'):
              assert 'node_modules' not in p.parts, p
              assert not p.name.endswith('.test.mjs'), p
          PY
