name: Build Corridor of the Lotus APK & IPA

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: "Build Android APK (debug)"
        type: boolean
        default: true
      build_ios:
        description: "Build iOS IPA (unsigned / sideload-ready)"
        type: boolean
        default: true
  push:
    paths:
      - "corridor_of_the_lotus/**"

jobs:
  build-android-apk:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_android }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install root Three.js / esbuild and Capacitor Android
        run: |
          npm install --no-audit --no-fund three esbuild
          cd corridor_of_the_lotus
          npm install --no-save --no-audit --no-fund @capacitor/core @capacitor/cli @capacitor/android

      - name: Build single HTML & stage mobile www
        working-directory: corridor_of_the_lotus
        run: |
          node tools/build-single-html.mjs
          node tools/stage-mobile-www.mjs

      - name: Build Android Debug APK
        working-directory: corridor_of_the_lotus
        run: bash tools/build-apk.sh debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: corridor-of-the-lotus-android-apk
          path: corridor_of_the_lotus/dist/android/*.apk

  build-ios-ipa:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_ios }}
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install root Three.js / esbuild and Capacitor iOS
        run: |
          npm install --no-audit --no-fund three esbuild
          cd corridor_of_the_lotus
          npm install --no-save --no-audit --no-fund @capacitor/core @capacitor/cli @capacitor/ios

      - name: Build single HTML & stage mobile www
        working-directory: corridor_of_the_lotus
        run: |
          node tools/build-single-html.mjs
          node tools/stage-mobile-www.mjs

      - name: Build Unsigned iOS IPA
        working-directory: corridor_of_the_lotus
        run: bash tools/build-ipa.sh unsigned

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: corridor-of-the-lotus-ios-ipa
          path: corridor_of_the_lotus/dist/ios/*.ipa
